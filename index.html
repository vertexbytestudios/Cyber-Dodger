<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- Mobile / fullscreen -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#060712" />

  <title>Cyber Dodger</title>

  <!-- YouTube Playables SDK -->
  <script src="https://www.youtube.com/game_api/v1"></script>

  <style>
    :root {
      --bg: #060712;
      --cyan: #12f7ff;
      --pink: #ff2c9c;
      --green: #6dff73;
      --yellow: #ffe66d;
      --red: #ff315d;
      --white: #f3fbff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    body {
      display: grid;
      place-items: center;
      touch-action: none;

      padding:
        max(6px, env(safe-area-inset-top))
        max(6px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(6px, env(safe-area-inset-left));
    }

    #stage {
      position: relative;

      width: min(
        calc(100vw - 12px),
        calc((100dvh - 12px) * 450 / 650)
      );

      height: min(
        calc(100dvh - 12px),
        calc((100vw - 12px) * 650 / 450)
      );

      aspect-ratio: 450 / 650;

      overflow: hidden;

      background: #070915;

      border-radius: 10px;

      box-shadow:
        0 0 0 1px rgba(18, 247, 255, 0.22),
        0 0 30px rgba(18, 247, 255, 0.10);

      contain: layout size style paint;

      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      touch-action: none;
    }

    /* =========================
       HUD
    ========================== */

    .hud {
      position: absolute;

      top: 9px;
      left: 9px;
      right: 9px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 6px;

      z-index: 5;

      pointer-events: none;
    }

    .hud-box {
      padding: 7px;

      background: rgba(8, 15, 31, 0.72);

      border:
        1px solid rgba(18, 247, 255, 0.20);

      border-radius: 8px;
    }

    .hud-label {
      display: block;

      font-size: 9px;
      font-weight: 900;

      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.60);
    }

    .hud-value {
      display: block;

      margin-top: 3px;

      font-size: clamp(15px, 4vw, 24px);
      font-weight: 900;

      color: var(--cyan);

      font-variant-numeric: tabular-nums;
    }

    /* =========================
       Buttons
    ========================== */

    .actions {
      position: absolute;

      right: 9px;
      bottom: 9px;

      display: flex;
      gap: 6px;

      z-index: 10;
    }

    button {
      min-height: 42px;

      border: 0;
      border-radius: 8px;

      padding: 9px 13px;

      color: var(--white);

      font: inherit;
      font-weight: 900;

      cursor: pointer;
    }

    .small-btn {
      background: rgba(8, 11, 28, 0.85);

      border:
        1px solid rgba(255, 255, 255, 0.18);

      text-transform: uppercase;

      font-size: 11px;
    }

    /* =========================
       Overlay
    ========================== */

    .overlay {
      position: absolute;
      inset: 0;

      z-index: 20;

      display: grid;
      place-items: center;

      padding: 18px;

      background:
        linear-gradient(
          180deg,
          rgba(6, 7, 18, 0.35),
          rgba(6, 7, 18, 0.92)
        );

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.16s ease,
        visibility 0.16s ease;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .panel {
      width: min(100%, 380px);

      padding: clamp(18px, 5vw, 28px);

      border-radius: 12px;

      background:
        linear-gradient(
          180deg,
          rgba(16, 22, 48, 0.97),
          rgba(6, 8, 24, 0.99)
        );

      border:
        1px solid rgba(18, 247, 255, 0.30);

      text-align: center;

      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.45);
    }

    .kicker {
      color: var(--green);

      font-size: 11px;
      font-weight: 900;

      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      margin-top: 8px;

      font-size: clamp(40px, 12vw, 68px);

      line-height: 0.86;

      text-transform: uppercase;
    }

    h2 {
      margin-top: 8px;

      font-size: clamp(30px, 9vw, 48px);

      text-transform: uppercase;
    }

    .copy {
      margin: 15px auto 0;

      max-width: 30ch;

      color: rgba(255, 255, 255, 0.80);

      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 7px;

      margin-top: 18px;
    }

    .stat {
      padding: 10px 6px;

      border-radius: 8px;

      background: rgba(255, 255, 255, 0.06);

      border:
        1px solid rgba(255, 255, 255, 0.10);
    }

    .stat span {
      display: block;

      color: rgba(255, 255, 255, 0.55);

      font-size: 9px;
      font-weight: 900;

      text-transform: uppercase;
    }

    .stat strong {
      display: block;

      margin-top: 4px;

      color: var(--yellow);

      font-size: clamp(16px, 4vw, 22px);
    }

    .buttons {
      display: grid;

      gap: 9px;

      margin-top: 20px;
    }

    .primary,
    .secondary,
    .danger {
      min-height: 48px;

      text-transform: uppercase;
    }

    .primary {
      color: #031118;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--green)
        );
    }

    .secondary {
      color: var(--cyan);

      background:
        rgba(18, 247, 255, 0.08);

      border:
        1px solid rgba(18, 247, 255, 0.45);
    }

    .danger {
      background:
        linear-gradient(
          90deg,
          var(--red),
          var(--pink)
        );
    }

    /* =========================
       Toast
    ========================== */

    #toast {
      position: absolute;

      left: 50%;
      top: 72px;

      z-index: 30;

      width: min(86%, 330px);

      transform:
        translateX(-50%)
        translateY(-12px);

      opacity: 0;

      padding: 9px 12px;

      border-radius: 8px;

      background:
        rgba(9, 10, 25, 0.94);

      border:
        1px solid rgba(255, 230, 109, 0.50);

      color: var(--yellow);

      text-align: center;

      font-size: 13px;
      font-weight: 900;

      pointer-events: none;

      transition:
        opacity 0.18s,
        transform 0.18s;
    }

    #toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================
       Ad preview outside YT
    ========================== */

    #adLayer {
      position: absolute;
      inset: 0;

      z-index: 40;

      display: grid;
      place-items: center;

      padding: 20px;

      background:
        rgba(4, 5, 14, 0.95);

      opacity: 0;
      visibility: hidden;
    }

    #adLayer.open {
      opacity: 1;
      visibility: visible;
    }

    .ad-card {
      width: min(100%, 360px);

      padding: 26px;

      border-radius: 12px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          #121735,
          #070817
        );

      border:
        1px solid rgba(18, 247, 255, 0.30);
    }

    .ad-title {
      color: var(--yellow);

      font-size: 12px;
      font-weight: 900;

      text-transform: uppercase;
    }

    .ad-copy {
      margin-top: 10px;

      font-size: 25px;
      font-weight: 900;

      text-transform: uppercase;
    }

    .meter {
      height: 8px;

      margin-top: 18px;

      overflow: hidden;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.12);
    }

    #adFill {
      width: 0;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--yellow),
          var(--pink),
          var(--cyan)
        );
    }

    .ad-note {
      margin-top: 12px;

      color: rgba(255, 255, 255, 0.60);

      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 390px),
           (max-height: 590px) {

      body {
        padding: 0;
      }

      #stage {
        width:
          min(
            100vw,
            calc(100dvh * 450 / 650)
          );

        height:
          min(
            100dvh,
            calc(100vw * 650 / 450)
          );

        border-radius: 0;
      }

      .hud {
        top: 6px;
        left: 6px;
        right: 6px;

        gap: 5px;
      }

      .hud-box {
        padding: 6px;
      }

      .actions {
        right: 6px;
        bottom: 6px;
      }
    }
  </style>
</head>

<body>

<div id="stage">

  <canvas id="game"></canvas>

  <div class="hud">

    <div class="hud-box">
      <span class="hud-label">Score</span>
      <span id="scoreUI" class="hud-value">0</span>
    </div>

    <div class="hud-box">
      <span class="hud-label">Multiplier</span>
      <span id="multUI" class="hud-value">1.0x</span>
    </div>

    <div class="hud-box">
      <span class="hud-label">Best</span>
      <span id="bestUI" class="hud-value">0</span>
    </div>

  </div>

  <div class="actions">

    <button id="pauseBtn" class="small-btn">
      Pause
    </button>

    <button id="soundBtn" class="small-btn">
      Sound
    </button>

  </div>

  <div id="overlay" class="overlay open">
    <div id="panel" class="panel"></div>
  </div>

  <div id="toast"></div>

  <div id="adLayer">

    <div class="ad-card">

      <div id="adTitle" class="ad-title">
        Ad
      </div>

      <div id="adCopy" class="ad-copy">
        Loading
      </div>

      <div class="meter">
        <div id="adFill"></div>
      </div>

      <p class="ad-note">
        Local preview. In YouTube Playables
        the real YouTube ad API is used.
      </p>

    </div>

  </div>

</div>


<script>
(() => {

  "use strict";


  /* ============================================================
     CONSTANTS
  ============================================================ */

  const WIDTH = 450;
  const HEIGHT = 650;

  const PLAYER_Y = 568;

  const TAU = Math.PI * 2;

  const SAVE_KEY =
    "cyber_dodger_save_v3";

  const REVIVE_REWARD_ID =
    "cyber_dodger_revive_v1";


  const COLORS = {
    cyan: "#12f7ff",
    pink: "#ff2c9c",
    green: "#6dff73",
    yellow: "#ffe66d",
    red: "#ff315d",
    violet: "#8f5cff",
    white: "#f3fbff"
  };


  /* ============================================================
     DEVICE / QUALITY
  ============================================================ */

  const isMobile =
    matchMedia("(pointer: coarse)").matches;

  const reducedMotion =
    matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;


  const MOBILE_MODE =
    isMobile || reducedMotion;


  /*
    Najważniejsze limity wydajności.

    Na telefonach:
    - mniej particle
    - mniej itemów
    - niższy DPR
    - mniej efektów
  */

  const QUALITY = {

    dpr:
      MOBILE_MODE ? 1.5 : 2,

    maxItems:
      MOBILE_MODE ? 48 : 90,

    maxParticles:
      MOBILE_MODE ? 110 : 220,

    maxWaves:
      MOBILE_MODE ? 8 : 16,

    maxMessages:
      MOBILE_MODE ? 8 : 14,

    stars:
      MOBILE_MODE ? 42 : 72

  };


  /* ============================================================
     DOM
  ============================================================ */

  const canvas =
    document.getElementById("game");

  const ctx =
    canvas.getContext("2d", {
      alpha: false,
      desynchronized: true
    });


  const stage =
    document.getElementById("stage");

  const overlay =
    document.getElementById("overlay");

  const panel =
    document.getElementById("panel");

  const toast =
    document.getElementById("toast");

  const adLayer =
    document.getElementById("adLayer");

  const adTitle =
    document.getElementById("adTitle");

  const adCopy =
    document.getElementById("adCopy");

  const adFill =
    document.getElementById("adFill");


  const scoreUI =
    document.getElementById("scoreUI");

  const multUI =
    document.getElementById("multUI");

  const bestUI =
    document.getElementById("bestUI");

  const soundBtn =
    document.getElementById("soundBtn");

  const pauseBtn =
    document.getElementById("pauseBtn");


  /* ============================================================
     HELPERS
  ============================================================ */

  const random =
    (min, max) =>
      Math.random() * (max - min) + min;


  const clamp =
    (value, min, max) =>
      Math.max(
        min,
        Math.min(max, value)
      );


  const lerp =
    (a, b, amount) =>
      a + (b - a) * amount;


  const easeOut =
    t => 1 - Math.pow(1 - t, 3);


  /* ============================================================
     YOUTUBE PLAYABLES
  ============================================================ */

  function getSDK() {
    return window.ytgame || null;
  }


  function inYouTubePlayables() {

    return Boolean(
      getSDK()?.IN_PLAYABLES_ENV
    );

  }


  function reportWarning(error) {

    try {

      getSDK()?.health?.logWarning?.();

    } catch (_) {}

  }


  function reportError(error) {

    try {

      getSDK()?.health?.logError?.();

    } catch (_) {}

  }


  /* ============================================================
     GAME STATE
  ============================================================ */

  const game = {

    state: "boot",

    score: 0,

    best: 0,

    runs: 0,

    multiplier: 1,

    combo: 0,

    comboTimer: 0,

    survival: 0,

    speed: 1,

    spawnTimer: 0.4,

    items: [],

    particles: [],

    waves: [],

    messages: [],

    stars: [],

    shake: 0,

    shakeTimer: 0,

    flash: 0,

    revived: false,

    adActive: false,

    firstFrameSent: false,

    gameReadySent: false,

    systemPaused: false,

    lastScoreSent: 0,


    player: {

      x: WIDTH / 2,

      targetX: WIDTH / 2,

      radius: 22,

      lean: 0,

      shield: 0,

      invincible: 0

    },


    input: {

      left: false,

      right: false

    }

  };


  /* ============================================================
     CANVAS RESIZE
     OPTIMIZED

     Nie robimy resizeCanvas()
     w każdej klatce.
  ============================================================ */

  let canvasRect = {
    left: 0,
    width: 1
  };


  let canvasDirty = true;


  function updateCanvasRect() {

    canvasRect =
      canvas.getBoundingClientRect();

    canvasDirty = true;

  }


  function resizeCanvas() {

    if (!canvasDirty) {
      return;
    }


    const rect =
      canvas.getBoundingClientRect();


    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        QUALITY.dpr
      );


    const width =
      Math.max(
        1,
        Math.round(rect.width * dpr)
      );


    const height =
      Math.max(
        1,
        Math.round(rect.height * dpr)
      );


    if (
      canvas.width !== width ||
      canvas.height !== height
    ) {

      canvas.width = width;
      canvas.height = height;

    }


    canvasRect = rect;

    canvasDirty = false;

  }


  const resizeObserver =
    new ResizeObserver(
      updateCanvasRect
    );


  resizeObserver.observe(stage);


  window.addEventListener(
    "resize",
    updateCanvasRect,
    { passive: true }
  );


  /* ============================================================
     SAVE DATA
  ============================================================ */

  async function loadSave() {

    let data = "";


    try {

      data =
        await getSDK()
          ?.game
          ?.loadData?.() || "";

    } catch (error) {

      reportWarning(error);

    }


    if (!data) {

      try {

        data =
          localStorage.getItem(SAVE_KEY) || "";

      } catch (error) {

        reportWarning(error);

      }

    }


    try {

      const save =
        JSON.parse(data);


      game.best =
        Math.max(
          0,
          Math.floor(save.best || 0)
        );


      game.runs =
        Math.max(
          0,
          Math.floor(save.runs || 0)
        );

    } catch (_) {}

  }


  async function saveGame() {

    const data =
      JSON.stringify({
        best: game.best,
        runs: game.runs
      });


    try {

      localStorage.setItem(
        SAVE_KEY,
        data
      );

    } catch (error) {

      reportWarning(error);

    }


    try {

      await getSDK()
        ?.game
        ?.saveData?.(data);

    } catch (error) {

      reportWarning(error);

    }

  }


  async function sendScore() {

    if (
      game.best <=
      game.lastScoreSent
    ) {
      return;
    }


    try {

      await getSDK()
        ?.engagement
        ?.sendScore?.({
          value: game.best
        });


      game.lastScoreSent =
        game.best;

    } catch (error) {

      reportWarning(error);

    }

  }


  /* ============================================================
     YOUTUBE LIFECYCLE
  ============================================================ */

  function notifyFirstFrameReady() {

    if (game.firstFrameSent) {
      return;
    }


    game.firstFrameSent = true;


    try {

      getSDK()
        ?.game
        ?.firstFrameReady?.();

    } catch (error) {

      reportWarning(error);

    }

  }


  function notifyGameReady() {

    if (game.gameReadySent) {
      return;
    }


    game.gameReadySent = true;


    try {

      getSDK()
        ?.game
        ?.gameReady?.();

    } catch (error) {

      reportWarning(error);

    }

  }


  /* ============================================================
     AUDIO
     LŻEJSZE NA MOBILE
  ============================================================ */

  const audio = {

    context: null,

    master: null,

    music: null,

    effects: null,

    enabled: true,

    youtubeEnabled: true,

    available: true,

    timer: 0,

    nextNote: 0,

    step: 0,

    tempo: 126

  };


  function audioEnabled() {

    return (
      audio.enabled &&
      audio.youtubeEnabled &&
      audio.available
    );

  }


  function initAudio() {

    if (audio.context) {
      return audio.context;
    }


    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {

      audio.available = false;

      return null;

    }


    try {

      const ac =
        new AudioContextClass();


      const master =
        ac.createGain();

      const music =
        ac.createGain();

      const effects =
        ac.createGain();


      master.gain.value = 0.75;

      music.gain.value =
        MOBILE_MODE ? 0.10 : 0.16;

      effects.gain.value = 0.55;


      music.connect(master);

      effects.connect(master);

      master.connect(
        ac.destination
      );


      audio.context = ac;

      audio.master = master;

      audio.music = music;

      audio.effects = effects;


      return ac;

    } catch (error) {

      audio.available = false;

      reportWarning(error);

      return null;

    }

  }


  function playTone(
    frequency,
    start,
    duration,
    type,
    volume,
    destination,
    slideTo
  ) {

    if (!audioEnabled()) {
      return;
    }


    const ac =
      audio.context;


    if (!ac) {
      return;
    }


    const oscillator =
      ac.createOscillator();

    const gain =
      ac.createGain();


    oscillator.type = type;

    oscillator.frequency
      .setValueAtTime(
        frequency,
        start
      );


    if (slideTo) {

      oscillator.frequency
        .exponentialRampToValueAtTime(
          Math.max(20, slideTo),
          start + duration
        );

    }


    gain.gain.setValueAtTime(
      0.0001,
      start
    );


    gain.gain
      .exponentialRampToValueAtTime(
        volume,
        start + 0.01
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.0001,
        start + duration
      );


    oscillator.connect(gain);

    gain.connect(destination);


    oscillator.onended = () => {

      try {

        oscillator.disconnect();
        gain.disconnect();

      } catch (_) {}

    };


    oscillator.start(start);

    oscillator.stop(
      start + duration + 0.03
    );

  }


  function playSFX(
    frequency,
    duration = 0.08,
    type = "square",
    volume = 0.05,
    slideTo
  ) {

    if (
      !audio.context ||
      !audioEnabled()
    ) {
      return;
    }


    playTone(
      frequency,
      audio.context.currentTime,
      duration,
      type,
      volume,
      audio.effects,
      slideTo
    );

  }


  function scheduleMusic() {

    const ac =
      audio.context;


    if (
      !ac ||
      !audioEnabled()
    ) {

      stopMusic();

      return;

    }


    const bass = [
      55,
      55,
      82.41,
      73.42,
      55,
      65.41,
      82.41,
      98
    ];


    const lead = [
      440,
      0,
      523.25,
      0,
      659.25,
      0,
      587.33,
      0
    ];


    const stepDuration =
      60 / audio.tempo / 4;


    while (
      audio.nextNote <
      ac.currentTime + 0.25
    ) {

      const step =
        audio.step;


      const time =
        audio.nextNote;


      if (step % 4 === 0) {

        const note =
          bass[
            (step / 4) %
            bass.length
          ];


        playTone(
          note,
          time,
          stepDuration * 2,
          "sawtooth",
          MOBILE_MODE ? 0.035 : 0.06,
          audio.music,
          note * 0.995
        );

      }


      const leadNote =
        lead[
          step %
          lead.length
        ];


      if (
        leadNote &&
        step % 2 === 0
      ) {

        playTone(
          leadNote,
          time,
          stepDuration * 0.65,
          "square",
          MOBILE_MODE ? 0.008 : 0.018,
          audio.music
        );

      }


      audio.step =
        (step + 1) % 32;


      audio.nextNote +=
        stepDuration;

    }

  }


  function startMusic() {

    const ac =
      audio.context;


    if (
      !ac ||
      !audioEnabled() ||
      audio.timer
    ) {
      return;
    }


    audio.nextNote =
      ac.currentTime + 0.05;


    audio.timer =
      setInterval(
        scheduleMusic,
        MOBILE_MODE ? 140 : 80
      );


    scheduleMusic();

  }


  function stopMusic() {

    if (audio.timer) {

      clearInterval(audio.timer);

      audio.timer = 0;

    }

  }


  function unlockAudio() {

    const ac =
      initAudio();


    if (!ac) {
      return;
    }


    ac.resume()
      .then(() => {

        startMusic();

      })
      .catch(reportWarning);

  }


  function resumeAudio() {

    if (!audio.context) {
      return;
    }


    audio.context
      .resume()
      .then(startMusic)
      .catch(reportWarning);

  }


  function suspendAudio() {

    stopMusic();


    if (
      audio.context &&
      audio.context.state === "running"
    ) {

      audio.context
        .suspend()
        .catch(reportWarning);

    }

  }

  /* ============================================================
     SDK PAUSE / AUDIO
  ============================================================ */

  function initSDKHooks() {

    const sdk =
      getSDK();


    if (!sdk) {
      return;
    }


    try {

      if (
        typeof sdk.system?.isAudioEnabled ===
        "function"
      ) {

        audio.youtubeEnabled =
          sdk.system.isAudioEnabled();

      }


      sdk.system
        ?.onAudioEnabledChange
        ?.((enabled) => {

          audio.youtubeEnabled =
            Boolean(enabled);


          if (!enabled) {

            stopMusic();

          } else {

            resumeAudio();

          }


          updateSoundButton();

        });


      sdk.system
        ?.onPause
        ?.(() => {

          if (
            game.state ===
            "playing"
          ) {

            game.state =
              "paused";

            game.systemPaused =
              true;

          }


          saveGame();

          suspendAudio();

        });


      sdk.system
        ?.onResume
        ?.(() => {

          if (
            game.systemPaused &&
            game.state ===
            "paused"
          ) {

            game.systemPaused =
              false;

            showPauseMenu();

          }

        });

    } catch (error) {

      reportWarning(error);

    }

  }

    if (

  function resetGame() {

    game.survival = 0;

    game.speed = 1;

  /* ============================================================
     ADS
     YouTube Playables:
     - rewarded
     - interstitial

     Local preview poza Playables.
  ============================================================ */

  async function requestAd(type) {

    const sdk =
      getSDK();


    /*
      PRAWDZIWE ŚRODOWISKO
      YOUTUBE PLAYABLES
    */

    if (
      inYouTubePlayables()
    ) {

      try {

        if (
          type === "rewarded" &&
          typeof sdk
            ?.ads
            ?.requestRewardedAd ===
          "function"
        ) {

          return Boolean(
            await sdk.ads.requestRewardedAd(
              REVIVE_REWARD_ID
            )
          );

        }


        if (
          type === "interstitial" &&
          typeof sdk
            ?.ads
            ?.requestInterstitialAd ===
          "function"
        ) {

          await sdk.ads.requestInterstitialAd();

          return true;

        }


        return false;

      } catch (error) {

        reportWarning(error);

        return false;

      }

    }


    /*
      POZA PLAYABLES
      tylko lokalny preview
    */

    return simulateAd(type);

  }


  function simulateAd(type) {

    game.adActive = true;


    adLayer.classList.add(
      "open"
    );


    adFill.style.width =
      "0%";


    adTitle.textContent =
      type === "rewarded"
        ? "Rewarded Ad"
        : "Interstitial";


    adCopy.textContent =
      type === "rewarded"
        ? "Revive Loading"
        : "Ad Break";


    return new Promise(
      resolve => {

        const start =
          performance.now();


        const duration =
          type === "rewarded"
            ? 1200
            : 900;


        function tick(now) {

          const progress =
            clamp(
              (now - start) /
              duration,
              0,
              1
            );


          adFill.style.width =
            Math.round(
              easeOut(progress) *
              100
            ) + "%";


          if (
            progress >= 1
          ) {

            adLayer
              .classList
              .remove("open");


            game.adActive =
              false;


            resolve(true);

          } else {

            requestAnimationFrame(
              tick
            );

          }

        }


        requestAnimationFrame(
          tick
        );

      }
    );

  }

  /* ============================================================
     EFFECTS
  ============================================================ */

  function addMessage(
    text,
    x,
    y,
    color
  ) {

    if (
      game.messages.length >=
      QUALITY.maxMessages
    ) {

      game.messages.shift();

    }


    game.messages.push({

      text,
      x,
      y,

      color,

      life: 0.8,

      maxLife: 0.8,

      velocityY: -36

    });

  }


  function burst(
    x,
    y,
    color,
    count,
    force
  ) {

    /*
      PRAWDZIWY LIMIT
      particle
    */

    const available =
      QUALITY.maxParticles -
      game.particles.length;


    count =
      Math.max(
        0,
        Math.min(
          count,
          available
        )
      );


    for (
      let i = 0;
      i < count;
      i++
    ) {

      const angle =
        random(0, TAU);


      const speed =
        random(
          force * 0.22,
          force
        );


      game.particles.push({

        x,
        y,

        vx:
          Math.cos(angle) *
          speed,

        vy:
          Math.sin(angle) *
          speed -
          random(20, 80),

        life:
          random(0.35, 0.82),

        maxLife:
          0.82,

        size:
          random(1.5, 4),

        color,

        drag:
          random(0.88, 0.96)

      });

    }

  }


  function addWave(
    x,
    y,
    color,
    radius
  ) {

    if (
      game.waves.length >=
      QUALITY.maxWaves
    ) {

      game.waves.shift();

    }


    game.waves.push({

      x,
      y,

      color,

      radius,

      age: 0,

      life: 0.48

    });

  }


  /* ============================================================
     SPAWN
  ============================================================ */

  function spawnItem(
    type,
    x
  ) {

    if (
      game.items.length >=
      QUALITY.maxItems
    ) {
      return;
    }


    const baseSpeed =
      random(138, 206) *
      game.speed;


    game.items.push({

      type,

      x,

      baseX: x,

      y: -30,

      radius:
        type === "virus"
          ? random(13, 19)
          : type === "shield"
            ? 13
            : random(9, 13),

      speed:
        type === "data"
          ? baseSpeed *
            random(0.88, 1.05)
          : baseSpeed *
            random(0.96, 1.18),

      drift:
        type === "virus"
          ? random(10, 38)
          : random(4, 18),

      phase:
        random(0, TAU),

      age: 0,

      rotation:
        random(0, TAU),

      spin:
        type === "virus"
          ? random(-4.8, 4.8)
          : random(-2.4, 2.4),

      value:
        type === "data"
          ? Math.round(
              random(10, 17)
            )
          : 0

    });

  }


  function spawnWave() {

    const margin = 34;


    const x =
      random(
        margin,
        WIDTH - margin
      );


    const dangerChance =
      clamp(
        0.46 +
        game.survival / 125,
        0.46,
        0.74
      );


    const roll =
      Math.random();


    if (
      roll < 0.08 &&
      game.survival > 8 &&
      game.player.shield < 2
    ) {

      spawnItem(
        "shield",
        x
      );

    }

    else if (
      roll < dangerChance
    ) {

      spawnItem(
        "virus",
        x
      );


      if (
        game.survival > 18 &&
        Math.random() < 0.22
      ) {

        spawnItem(
          "data",
          clamp(
            x +
            random(-94, 94),
            margin,
            WIDTH - margin
          )
        );

      }

    }

    else {

      spawnItem(
        "data",
        x
      );


      if (
        game.survival > 12 &&
        Math.random() < 0.15
      ) {

        spawnItem(
          "data",
          clamp(
            x +
            random(-76, 76),
            margin,
            WIDTH - margin
          )
        );

      }

    }


    if (
      game.survival > 28 &&
      Math.random() < 0.08
    ) {

      spawnItem(
        "virus",

        Math.random() < 0.5
          ? random(margin, 150)
          : random(
              WIDTH - 150,
              WIDTH - margin
            )
      );

    }

  }


  /* ============================================================
     COLLISIONS
  ============================================================ */

  function collectData(item) {

    game.combo++;

    game.comboTimer =

    game.multiplier =

  function hitVirus(item) {

    burst(

  function endGame() {

  /* ============================================================
     UPDATE GAME
  ============================================================ */

  function updateGame(dt) {

    game.survival +=
      dt;


    game.speed =
      1 +
      Math.min(
        1.85,
        game.survival / 48
      );


    game.spawnTimer -=
      dt;


    if (
      game.spawnTimer <= 0
    ) {

      spawnWave();


      game.spawnTimer =
        clamp(
          0.72 -
          game.survival * 0.006,
          0.29,
          0.72
        ) *
        random(
          0.76,
          1.14
        );

    }


    /* PLAYER */

    const player =
      game.player;


    if (
      game.input.left
    ) {

      player.targetX -=
        380 * dt;

    }


    if (
      game.input.right
    ) {

      player.targetX +=
        380 * dt;

    }


    player.targetX =
      clamp(
        player.targetX,
        30,
        WIDTH - 30
      );


    const oldX =
      player.x;


    player.x =
      lerp(
        player.x,
        player.targetX,
        1 -
        Math.exp(-14 * dt)
      );


    player.lean =
      lerp(
        player.lean,

        clamp(
          (player.x - oldX) *
          0.62,

          -13,
          13
        ),

        1 -
        Math.exp(-10 * dt)
      );


    player.invincible =
      Math.max(
        0,
        player.invincible - dt
      );


    /* COMBO */

    if (
      game.comboTimer > 0
    ) {

      game.comboTimer -= dt;

    }

    else if (
      game.combo > 0
    ) {

      game.combo =
        Math.max(
          0,
          Math.floor(
            game.combo * 0.55
          )
        );


      game.multiplier =
        1 +
        Math.min(
          4.2,
          game.combo * 0.075
        );

    }


    /* ITEMS */

    for (
      let i =
        game.items.length - 1;

      i >= 0;

      i--
    ) {

      const item =
        game.items[i];


      item.age += dt;


      item.y +=
        item.speed * dt;


      item.x =
        item.baseX +
        Math.sin(
          item.age * 2.3 +
          item.phase
        ) *
        item.drift;


      item.rotation +=
        item.spin * dt;


      const dx =
        item.x -
        player.x;


      const dy =
        item.y -
        PLAYER_Y;


      const distanceSquared =
        dx * dx +
        dy * dy;


      const collisionRadius =
        player.radius +
        item.radius;


      if (
        distanceSquared <
        collisionRadius *
        collisionRadius
      ) {

        if (
          item.type ===
          "data"
        ) {

          collectData(item);

        }

        else if (
          item.type ===
          "shield"
        ) {

          collectShield(item);

        }

        else {

          hitVirus(item);

        }


        game.items.splice(
          i,
          1
        );


        continue;

      }


      if (
        item.y >
        HEIGHT + 40
      ) {

        game.items.splice(
          i,
          1
        );

      }

    }


    updateHUD();

  }


  /* ============================================================
     UPDATE EFFECTS
  ============================================================ */

  function updateEffects(dt) {

    for (
      const star of
      game.stars
    ) {

      star.y +=
        star.speed *
        (
          game.state ===
          "playing"
            ? game.speed
            : 0.5
        ) *
        dt;


      if (
        star.y >
        HEIGHT + 4
      ) {

        star.y =
          -4;


        star.x =
          random(0, WIDTH);

      }

    }


    /* PARTICLES */

    for (
      let i =
        game.particles.length - 1;

      i >= 0;

      i--
    ) {

      const particle =
        game.particles[i];


      particle.life -=
        dt;


      if (
        particle.life <= 0
      ) {

        game.particles.splice(
          i,
          1
        );

        continue;

      }


      const drag =
        Math.pow(
          particle.drag,
          dt * 60
        );


      particle.vx *=
        drag;


      particle.vy =
        particle.vy *
        drag +
        120 * dt;


      particle.x +=
        particle.vx * dt;


      particle.y +=
        particle.vy * dt;

    }


    /* WAVES */

    for (
      let i =
        game.waves.length - 1;

      i >= 0;

      i--
    ) {

      const wave =
        game.waves[i];


      wave.age +=
        dt;


      if (
        wave.age >=
        wave.life
      ) {

        game.waves.splice(
          i,
          1
        );

      }

    }


    /* MESSAGES */

    for (
      let i =
        game.messages.length - 1;

      i >= 0;

      i--
    ) {

      const message =
        game.messages[i];


      message.life -=
        dt;


      if (
        message.life <= 0
      ) {

        game.messages.splice(
          i,
          1
        );

      }

      else {

        message.y +=
          message.velocityY *
          dt;

      }

    }


    /* SHAKE */

    if (
      game.shakeTimer > 0
    ) {

      game.shakeTimer -=
        dt;


      game.shake *=
        Math.pow(
          0.84,
          dt * 60
        );

    }

    else {

      game.shake = 0;

    }


    game.flash =
      Math.max(
        0,
        game.flash -
        dt * 1.9
      );

  }


  /* ============================================================
     STARS
  ============================================================ */

  function buildStars() {

    game.stars.length =
      0;


    for (
      let i = 0;

      i < QUALITY.stars;

      i++
    ) {

      game.stars.push({

        x:
          random(0, WIDTH),

        y:
          random(0, HEIGHT),

        speed:
          random(12, 56),

        size:
          random(0.6, 1.8),

        color:
          Math.random() < 0.5
            ? COLORS.cyan
            : COLORS.pink

      });

    }

  }


  /* ============================================================
     DRAW HELPERS
  ============================================================ */

  const backgroundGradient =
    (() => {

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          HEIGHT
        );


      gradient.addColorStop(
        0,
        "#060712"
      );


      gradient.addColorStop(
        0.52,
        "#090b1f"
      );


      gradient.addColorStop(
        1,
        "#04050d"
      );


      return gradient;

    })();


  function setGameTransform() {

    const scaleX =
      canvas.width /
      WIDTH;


    const scaleY =
      canvas.height /
      HEIGHT;


    let shakeX = 0;
    let shakeY = 0;


    if (
      game.shakeTimer > 0
    ) {

      shakeX =
        random(
          -game.shake,
          game.shake
        );


      shakeY =
        random(
          -game.shake,
          game.shake
        );

    }


    ctx.setTransform(
      scaleX,
      0,
      0,
      scaleY,

      shakeX *
      scaleX,

      shakeY *
      scaleY
    );

  }


  /* ============================================================
     DRAW BACKGROUND
  ============================================================ */

  function drawBackground(time) {

    ctx.fillStyle =
      backgroundGradient;


    ctx.fillRect(
      0,
      0,
      WIDTH,
      HEIGHT
    );


    ctx.save();


    ctx.globalCompositeOperation =
      "lighter";


    for (
      const star of
      game.stars
    ) {

      ctx.globalAlpha =
        0.35;


      ctx.fillStyle =
        star.color;


      ctx.fillRect(
        star.x,
        star.y,
        star.size,
        star.size
      );

    }


    ctx.restore();


    /*
      Lightweight perspective grid
    */

    const horizon =
      185;


    const spacing =
      37;


    const offset =
      (
        time *
        70 *
        (
          game.state ===
          "playing"
            ? game.speed
            : 0.6
        )
      ) %
      spacing;


    ctx.save();


    ctx.lineWidth = 1;


    for (
      let y =
        horizon + offset;

      y <
        HEIGHT + spacing;

      y += spacing
    ) {

      ctx.globalAlpha =
        clamp(
          (y - horizon) /
          (HEIGHT - horizon) *
          0.35,

          0.05,
          0.35
        );


      ctx.strokeStyle =
        COLORS.cyan;


      ctx.beginPath();

      ctx.moveTo(
        0,
        y
      );

      ctx.lineTo(
        WIDTH,
        y
      );

      ctx.stroke();

    }


    for (
      let i = -5;

      i <= 5;

      i++
    ) {

      ctx.globalAlpha =
        0.14;


      ctx.strokeStyle =
        i % 2
          ? COLORS.cyan
          : COLORS.pink;


      ctx.beginPath();


      ctx.moveTo(
        WIDTH / 2 +
        i * 9,
        horizon
      );


      ctx.lineTo(
        WIDTH / 2 +
        i * 70,
        HEIGHT
      );


      ctx.stroke();

    }


    ctx.restore();

  }


  /* ============================================================
     DRAW ITEM
  ============================================================ */

  function drawItem(
    item
  ) {

    ctx.save();


    ctx.translate(
      item.x,
      item.y
    );


    ctx.rotate(
      item.rotation
    );


    ctx.globalCompositeOperation =
      "lighter";


    if (
      item.type ===
      "data"
    ) {

      ctx.strokeStyle =
        COLORS.green;


      ctx.fillStyle =
        "rgba(109,255,115,0.22)";


      ctx.beginPath();

      ctx.moveTo(
        0,
        -item.radius * 1.35
      );

      ctx.lineTo(
        item.radius * 1.15,
        0
      );

      ctx.lineTo(
        0,
        item.radius * 1.35
      );

      ctx.lineTo(
        -item.radius * 1.15,
        0
      );

      ctx.closePath();


      ctx.fill();

      ctx.stroke();

    }


    else if (
      item.type ===
      "shield"
    ) {

      ctx.strokeStyle =
        COLORS.cyan;


      ctx.fillStyle =
        "rgba(18,247,255,0.16)";


      ctx.beginPath();


      for (
        let i = 0;

        i < 6;

        i++
      ) {

        const angle =
          -Math.PI / 2 +
          i *
          TAU / 6;


        const x =
          Math.cos(angle) *
          item.radius *
          1.45;


        const y =
          Math.sin(angle) *
          item.radius *
          1.45;


        if (i === 0) {

          ctx.moveTo(x, y);

        } else {

          ctx.lineTo(x, y);

        }

      }


      ctx.closePath();

      ctx.fill();

      ctx.stroke();

    }


    else {

      ctx.strokeStyle =
        COLORS.red;


      ctx.fillStyle =
        "rgba(255,49,93,0.28)";


      ctx.beginPath();


      for (
        let i = 0;

        i < 18;

        i++
      ) {

        const radius =
          i % 2
            ? item.radius * 0.72
            : item.radius * 1.45;


        const angle =
          i *
          Math.PI / 9;


        const x =
          Math.cos(angle) *
          radius;


        const y =
          Math.sin(angle) *
          radius;


        if (i === 0) {

          ctx.moveTo(x, y);

        } else {

          ctx.lineTo(x, y);

        }

      }


      ctx.closePath();

      ctx.fill();

      ctx.stroke();

    }


    ctx.restore();

  }


  /* ============================================================
     DRAW PARTICLES
     BEZ shadowBlur
     BEZ save/restore na particle
  ============================================================ */

  function drawParticles() {

    ctx.save();


    ctx.globalCompositeOperation =
      "lighter";


    for (
      const particle of
      game.particles
    ) {

      ctx.globalAlpha =
        clamp(
          particle.life /
          particle.maxLife,
          0,
          1
        );


      ctx.fillStyle =
        particle.color;


      ctx.fillRect(
        particle.x -
        particle.size / 2,

        particle.y -
        particle.size / 2,

        particle.size,
        particle.size
      );

    }


    ctx.restore();

  }


  /* ============================================================
     DRAW WAVES
  ============================================================ */

  function drawWaves() {

    ctx.save();


    ctx.globalCompositeOperation =
      "lighter";


    for (
      const wave of
      game.waves
    ) {

      const progress =
        clamp(
          wave.age /
          wave.life,
          0,
          1
        );


      ctx.globalAlpha =
        (1 - progress) *
        0.72;


      ctx.lineWidth =
        2 +
        progress * 4;


      ctx.strokeStyle =
        wave.color;


      ctx.beginPath();


      ctx.arc(
        wave.x,
        wave.y,

        wave.radius *
        easeOut(progress),

        0,
        TAU
      );


      ctx.stroke();

    }


    ctx.restore();

  }


  /* ============================================================
     DRAW PLAYER
  ============================================================ */

  function drawPlayer(time) {

    const player =
      game.player;


    ctx.save();


    ctx.translate(
      player.x,
      PLAYER_Y
    );


    ctx.rotate(
      player.lean *
      0.018
    );


    ctx.globalCompositeOperation =
      "lighter";


    if (
      player.shield > 0 ||
      player.invincible > 0
    ) {

      ctx.globalAlpha =
        0.65;


      ctx.strokeStyle =
        player.shield > 0
          ? COLORS.yellow
          : COLORS.cyan;


      ctx.lineWidth =
        3;


      ctx.beginPath();


      ctx.arc(
        0,
        0,
        player.radius + 10,
        0,
        TAU
      );


      ctx.stroke();

    }


    if (
      player.invincible > 0
    ) {

      const pulse =
        Math.sin(time * 22) *
        0.5 +
        0.5;


      ctx.globalAlpha =
        0.6 +
        pulse * 0.4;

    }


    ctx.fillStyle =
      "rgba(18,247,255,0.22)";


    ctx.strokeStyle =
      COLORS.cyan;


    ctx.lineWidth =
      4;


    ctx.beginPath();


    ctx.moveTo(
      0,
      -player.radius - 12
    );


    ctx.bezierCurveTo(
      player.radius + 17,
      -player.radius - 14,

      player.radius + 19,
      player.radius + 6,

      0,
      player.radius + 14
    );


    ctx.bezierCurveTo(
      -player.radius - 19,
      player.radius + 6,

      -player.radius - 17,
      -player.radius - 14,

      0,
      -player.radius - 12
    );


    ctx.closePath();


    ctx.fill();

    ctx.stroke();


    ctx.strokeStyle =
      COLORS.pink;


    ctx.lineWidth =
      2;


    ctx.beginPath();


    ctx.arc(
      0,
      2,
      player.radius * 0.82,
      Math.PI * 0.08,
      Math.PI * 0.92,
      true
    );


    ctx.stroke();


    ctx.fillStyle =
      COLORS.white;


    ctx.beginPath();


    ctx.arc(
      -7,
      -2,
      3,
      0,
      TAU
    );


    ctx.arc(
      7,
      -2,
      3,
      0,
      TAU
    );


    ctx.fill();


    ctx.restore();

  }


  /* ============================================================
     DRAW MESSAGES
  ============================================================ */

  function drawMessages() {

    ctx.save();


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.font =
      "900 20px system-ui";


    for (
      const message of
      game.messages
    ) {

      ctx.globalAlpha =
        clamp(
          message.life /
          message.maxLife,
          0,
          1
        );


      ctx.fillStyle =
        message.color;


      ctx.fillText(
        message.text,
        message.x,
        message.y
      );

    }


    ctx.restore();

  }


  /* ============================================================
     TELEMETRY
  ============================================================ */

  function drawTelemetry() {

    const progress =
      clamp(
        game.survival / 60,
        0,
        1
      );


    const y =
      HEIGHT - 24;


    ctx.save();


    ctx.globalAlpha =
      0.8;


    ctx.fillStyle =
      "rgba(255,255,255,0.10)";


    ctx.fillRect(
      34,
      y,
      WIDTH - 68,
      5
    );


    ctx.fillStyle =
      COLORS.cyan;


    ctx.fillRect(
      34,
      y,

      (WIDTH - 68) *
      progress,

      5
    );


    if (
      game.state ===
      "playing"
    ) {

      ctx.fillStyle =
        COLORS.yellow;


      ctx.font =
        "900 12px system-ui";


      ctx.textAlign =
        "center";


      ctx.fillText(
        Math.floor(
          game.survival
        ) + "s",

        WIDTH / 2,

        y - 8
      );

    }


    ctx.restore();

  }


  /* ============================================================
     DRAW
  ============================================================ */

  function draw(time) {

    /*
      Resize tylko gdy faktycznie
      zmienił się rozmiar.
    */

    resizeCanvas();


    setGameTransform();


    drawBackground(
      time
    );


    for (
      const item of
      game.items
    ) {

      drawItem(item);

    }


    drawParticles();

    drawWaves();

    drawPlayer(time);

    drawMessages();

    drawTelemetry();


    if (
      game.flash > 0
    ) {

      ctx.globalAlpha =
        Math.min(
          0.32,
          game.flash
        );


      ctx.fillStyle =
        COLORS.red;


      ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );

    }


    ctx.setTransform(
      1,
      0,
      0,
      1,
      0,
      0
    );

  }


  /* ============================================================
     GAME LOOP
  ============================================================ */

  let lastFrame =
    performance.now();


  function frame(now) {

    /*
      Limit dt.
      Chroni przed ogromnym skokiem
      po lagach / zmianie karty.
    */

    const dt =
      Math.min(
        0.033,
        (now - lastFrame) / 1000
      );


    lastFrame =
      now;


    if (
      game.state ===
      "playing" &&
      !game.adActive
    ) {

      updateGame(dt);

    }


    updateEffects(dt);


    draw(
      now / 1000
    );


    notifyFirstFrameReady();


    requestAnimationFrame(
      frame
    );

  }


  /* ============================================================
     INPUT
  ============================================================ */

  function clientToGameX(
    clientX
  ) {

    return clamp(

      (
        (clientX - canvasRect.left) /
        canvasRect.width
      ) *
      WIDTH,

      30,

      WIDTH - 30

    );

  }


  function handlePointer(
    event
  ) {

    if (
      game.state !==
      "playing"
    ) {
      return;
    }


    event.preventDefault();


    game.player.targetX =
      clientToGameX(
        event.clientX
      );

  }


  canvas.addEventListener(
    "pointerdown",

    event => {

      unlockAudio();

      handlePointer(event);

    },

    {
      passive: false
    }
  );


  canvas.addEventListener(
    "pointermove",

    handlePointer,

    {
      passive: false
    }
  );


  /* ============================================================
     KEYBOARD
  ============================================================ */

  window.addEventListener(
    "keydown",

    event => {

      const key =
        event.key.toLowerCase();


      if (
        key === "arrowleft" ||
        key === "a"
      ) {

        game.input.left =
          true;

        event.preventDefault();

      }


      if (
        key === "arrowright" ||
        key === "d"
      ) {

        game.input.right =
          true;

        event.preventDefault();

      }


      if (
        key === " " ||
        key === "enter"
      ) {

        if (
          game.state ===
          "menu"
        ) {

          startGame();

        }

        else if (
          game.state ===
          "playing" ||
          game.state ===
          "paused"
        ) {

          togglePause();

        }


        event.preventDefault();

      }


      if (
        key === "m"
      ) {

        audio.enabled =
          !audio.enabled;


        if (
          !audio.enabled
        ) {

          stopMusic();

        }

        else {

          unlockAudio();

        }


        updateSoundButton();

      }

    }
  );


  window.addEventListener(
    "keyup",

    event => {

      const key =
        event.key.toLowerCase();


      if (
        key === "arrowleft" ||
        key === "a"
      ) {

        game.input.left =
          false;

      }


      if (
        key === "arrowright" ||
        key === "d"
      ) {

        game.input.right =
          false;

      }

    }
  );


  /* ============================================================
     BUTTONS
  ============================================================ */

  soundBtn.addEventListener(
    "click",

    () => {

      audio.enabled =
        !audio.enabled;


      if (
        !audio.enabled
      ) {

        stopMusic();

      }

      else {

        unlockAudio();

      }


      updateSoundButton();

    }
  );


  pauseBtn.addEventListener(
    "click",

    togglePause
  );


  /* ============================================================
     VISIBILITY
  ============================================================ */

  document.addEventListener(
    "visibilitychange",

    () => {

      if (
        document.hidden
      ) {

        if (
          game.state ===
          "playing"
        ) {

          game.state =
            "paused";


          game.systemPaused =
            true;

        }


        saveGame();

        suspendAudio();

      }

      else if (

        game.systemPaused &&

        game.state ===
        "paused"

      ) {

        game.systemPaused =
          false;


        showPauseMenu();

      }

    }
  );


  /* ============================================================
     ERRORS
  ============================================================ */

  window.addEventListener(
    "error",

    event => {

      reportError(
        event.error ||
        event.message
      );

    }
  );


  window.addEventListener(
    "unhandledrejection",

    event => {

      reportError(
        event.reason
      );

    }
  );


  /* ============================================================
     BOOT
  ============================================================ */

  async function boot() {

    buildStars();


    updateCanvasRect();

    resizeCanvas();


    initSDKHooks();


    await loadSave();


    updateSoundButton();

    updateHUD(true);


    showMenu();


    draw(
      performance.now() / 1000
    );


    /*
      YouTube Playables:
      pierwszy frame gotowy
    */

    notifyFirstFrameReady();


    /*
      Gra gotowa
    */

    notifyGameReady();


    requestAnimationFrame(
      frame
    );

  }


  boot()
    .catch(
      error => {

        reportError(error);

        showMenu();

        requestAnimationFrame(
          frame
        );

      }
    );

})();
</script>

</body>
</html>
