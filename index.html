<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#060712"
  >

  <title>Cyber Dodger: Neon Run</title>

  <!-- YouTube Playables SDK: musi być załadowane przed kodem gry -->
  <script src="https://www.youtube.com/game_api/v1"></script>

  <style>
    :root {
      --bg: #060712;
      --ink: #f3fbff;
      --cyan: #12f7ff;
      --cyan-soft: rgba(18, 247, 255, 0.28);
      --pink: #ff2c9c;
      --green: #6dff73;
      --yellow: #ffe66d;
      --red: #ff315d;
      --violet: #8f5cff;

      --panel: rgba(6, 8, 24, 0.82);
      --panel-strong: rgba(9, 12, 34, 0.94);
      --glass: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;

      overflow: hidden;

      overscroll-behavior: none;

      background:
        radial-gradient(
          circle at 14% 14%,
          rgba(18, 247, 255, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 84% 18%,
          rgba(255, 44, 156, 0.17),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 110%,
          rgba(109, 255, 115, 0.12),
          transparent 28%
        ),
        var(--bg);

      color: var(--ink);

      font-family:
        "Trebuchet MS",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      letter-spacing: 0;

      user-select: none;
      -webkit-user-select: none;

      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: grid;
      place-items: center;

      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));

      touch-action: none;
    }

    #stage {
      position: relative;

      width:
        min(
          calc(100vw - 20px),
          calc((100vh - 20px) * 450 / 650)
        );

      height:
        min(
          calc(100vh - 20px),
          calc((100vw - 20px) * 650 / 450)
        );

      width:
        min(
          calc(100vw - 20px),
          calc((100dvh - 20px) * 450 / 650)
        );

      height:
        min(
          calc(100dvh - 20px),
          calc((100vw - 20px) * 650 / 450)
        );

      max-width: 620px;
      max-height: calc(100dvh - 20px);

      aspect-ratio: 450 / 650;

      overflow: hidden;

      contain:
        layout
        size
        style
        paint;

      touch-action: none;

      border-radius: 8px;

      background: #070915;

      box-shadow:
        0 0 0 1px rgba(18, 247, 255, 0.34),
        0 0 28px rgba(18, 247, 255, 0.22),
        0 0 70px rgba(255, 44, 156, 0.12);
    }

    canvas {
      position: absolute;
      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      touch-action: none;

      cursor: crosshair;

      background: #070915;
    }

    .hud {
      position: absolute;

      top: 10px;
      left: 10px;
      right: 10px;

      z-index: 4;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;

      pointer-events: none;
    }

    .hud-cell {
      min-width: 0;

      border:
        1px solid rgba(18, 247, 255, 0.24);

      border-radius: 8px;

      padding:
        7px 8px 6px;

      background:
        linear-gradient(
          180deg,
          rgba(8, 15, 31, 0.74),
          rgba(8, 12, 30, 0.34)
        );

      box-shadow:
        inset 0 0 18px
        rgba(18, 247, 255, 0.07);

      text-shadow:
        0 0 8px
        rgba(18, 247, 255, 0.55);
    }

    .hud-label {
      display: block;

      color:
        rgba(243, 251, 255, 0.70);

      font-size:
        clamp(10px, 2.2vw, 12px);

      font-weight: 700;

      line-height: 1;

      text-transform: uppercase;
    }

    .hud-value {
      display: block;

      margin-top: 3px;

      color: var(--cyan);

      font-variant-numeric:
        tabular-nums;

      font-size:
        clamp(15px, 4.3vw, 24px);

      font-weight: 900;

      line-height: 1;
    }

    .top-actions {
      position: absolute;

      right: 10px;
      bottom: 10px;

      z-index: 6;

      display: flex;

      gap: 7px;
    }

    button {
      appearance: none;

      border: 0;

      border-radius: 8px;

      font: inherit;

      font-weight: 900;

      letter-spacing: 0;

      color: var(--ink);

      cursor: pointer;
    }

    button:focus-visible {
      outline:
        3px solid
        rgba(255, 230, 109, 0.88);

      outline-offset: 3px;
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .icon-btn {
      min-width: 42px;
      min-height: 42px;

      display: inline-grid;

      place-items: center;

      padding:
        0 10px;

      border:
        1px solid
        rgba(255, 255, 255, 0.20);

      background:
        rgba(8, 11, 28, 0.66);

      box-shadow:
        0 0 14px
        rgba(18, 247, 255, 0.14);

      text-transform: uppercase;

      font-size: 12px;

      touch-action: manipulation;
    }

    .overlay {
      position: absolute;
      inset: 0;

      z-index: 8;

      display: grid;

      place-items: center;

      padding: 18px;

      opacity: 0;

      visibility: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(6, 7, 18, 0.28),
          rgba(6, 7, 18, 0.86)
        ),
        radial-gradient(
          circle at center,
          rgba(18, 247, 255, 0.08),
          transparent 46%
        );

      transition:
        opacity 180ms ease,
        visibility 180ms ease;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .panel {
      width:
        min(
          100%,
          380px
        );

      max-height: 100%;

      overflow: auto;

      border:
        1px solid
        rgba(18, 247, 255, 0.30);

      border-radius: 8px;

      padding:
        clamp(18px, 5vw, 28px);

      background:
        linear-gradient(
          180deg,
          rgba(16, 22, 48, 0.90),
          rgba(6, 8, 24, 0.94)
        ),
        radial-gradient(
          circle at 20% 0%,
          rgba(18, 247, 255, 0.16),
          transparent 38%
        );

      box-shadow:
        0 0 0 1px
        rgba(255, 44, 156, 0.16),

        0 18px 80px
        rgba(0, 0, 0, 0.50),

        inset 0 0 38px
        rgba(18, 247, 255, 0.08);

      text-align: center;
    }

    .kicker {
      color: var(--green);

      font-size: 12px;

      font-weight: 900;

      text-transform: uppercase;

      text-shadow:
        0 0 12px
        rgba(109, 255, 115, 0.72);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      margin-top: 8px;

      color: var(--ink);

      font-size:
        clamp(38px, 12vw, 66px);

      line-height: 0.86;

      text-transform: uppercase;

      text-shadow:
        0 0 8px
        rgba(18, 247, 255, 0.75),

        0 0 18px
        rgba(255, 44, 156, 0.45);
    }

    h2 {
      margin-top: 5px;

      font-size:
        clamp(28px, 8vw, 44px);

      line-height: 0.95;

      text-transform: uppercase;

      text-shadow:
        0 0 18px
        rgba(255, 49, 93, 0.56);
    }

    .panel-copy {
      margin:
        14px auto 0;

      max-width: 28ch;

      color:
        rgba(243, 251, 255, 0.82);

      font-size: 15px;

      line-height: 1.42;
    }

    .stat-row {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;

      margin-top: 18px;
    }

    .menu-stat {
      min-width: 0;

      border-radius: 8px;

      padding:
        10px 6px;

      background:
        rgba(255, 255, 255, 0.07);

      border:
        1px solid
        rgba(255, 255, 255, 0.12);
    }

    .menu-stat span {
      display: block;

      color:
        rgba(243, 251, 255, 0.62);

      font-size: 10px;

      font-weight: 900;

      text-transform: uppercase;
    }

    .menu-stat strong {
      display: block;

      margin-top: 3px;

      color:
        var(--yellow);

      font-size:
        clamp(16px, 4vw, 22px);

      font-variant-numeric:
        tabular-nums;

      line-height: 1;

      text-shadow:
        0 0 10px
        rgba(255, 230, 109, 0.42);
    }

    .button-stack {
      display: grid;

      gap: 10px;

      margin-top: 20px;
    }

    .btn-primary,
    .btn-secondary,
    .btn-danger {
      min-height: 48px;

      padding:
        12px 14px;

      text-transform: uppercase;

      box-shadow:
        0 0 22px
        rgba(18, 247, 255, 0.18);

      touch-action: manipulation;
    }

    .btn-primary {
      color: #031118;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--green)
        );

      text-shadow: none;
    }

    .btn-secondary {
      color: var(--cyan);

      border:
        1px solid
        rgba(18, 247, 255, 0.46);

      background:
        rgba(18, 247, 255, 0.08);
    }

    .btn-danger {
      color: var(--ink);

      background:
        linear-gradient(
          90deg,
          rgba(255, 49, 93, 0.95),
          rgba(255, 44, 156, 0.82)
        );
    }

    .btn-primary:active,
    .btn-secondary:active,
    .btn-danger:active,
    .icon-btn:active {
      transform:
        translateY(1px);
    }

    .toast {
      position: absolute;

      left: 50%;
      top: 72px;

      z-index: 10;

      width:
        min(86%, 330px);

      transform:
        translateX(-50%)
        translateY(-12px);

      opacity: 0;

      border:
        1px solid
        rgba(255, 230, 109, 0.48);

      border-radius: 8px;

      padding:
        9px 12px;

      background:
        rgba(9, 10, 25, 0.86);

      color:
        var(--yellow);

      text-align: center;

      font-size: 13px;

      font-weight: 900;

      pointer-events: none;

      transition:
        opacity 180ms ease,
        transform 180ms ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    .ad-layer {
      position: absolute;
      inset: 0;

      z-index: 12;

      display: grid;

      place-items: center;

      padding: 18px;

      opacity: 0;
      visibility: hidden;

      background:
        rgba(4, 5, 14, 0.88);

      transition:
        opacity 180ms ease,
        visibility 180ms ease;
    }

    .ad-layer.open {
      opacity: 1;
      visibility: visible;
    }

    .ad-card {
      width:
        min(
          100%,
          340px
        );

      border:
        1px solid
        rgba(255, 230, 109, 0.34);

      border-radius: 8px;

      padding: 22px;

      background:
        linear-gradient(
          180deg,
          rgba(25, 19, 39, 0.96),
          rgba(8, 8, 24, 0.96)
        );

      box-shadow:
        0 0 42px
        rgba(255, 230, 109, 0.16);

      text-align: center;
    }

    .ad-title {
      color:
        var(--yellow);

      font-size: 12px;

      font-weight: 900;

      text-transform: uppercase;
    }

    .ad-copy {
      margin-top: 8px;

      color:
        var(--ink);

      font-size: 24px;

      font-weight: 900;

      text-transform: uppercase;
    }

    .ad-meter {
      height: 8px;

      margin-top: 18px;

      overflow: hidden;

      border-radius: 8px;

      background:
        rgba(255, 255, 255, 0.12);
    }

    .ad-fill {
      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--yellow),
          var(--pink),
          var(--cyan)
        );

      transition:
        width 80ms linear;
    }

    .ad-note {
      margin-top: 12px;

      color:
        rgba(243, 251, 255, 0.64);

      font-size: 12px;

      line-height: 1.35;
    }

    @media
      (max-width: 390px),
      (max-height: 590px) {

      body {
        padding: 0;
      }

      #stage {
        width:
          min(
            100vw,
            calc(100dvh * 450 / 650)
          );

        height:
          min(
            100dvh,
            calc(100vw * 650 / 450)
          );

        border-radius: 0;
      }

      .hud {
        top: 7px;
        left: 7px;
        right: 7px;
        gap: 5px;
      }

      .hud-cell {
        padding:
          6px 5px 5px;
      }

      .panel {
        padding: 17px;
      }

      .top-actions {
        right: 7px;
        bottom: 7px;
      }

      .icon-btn {
        min-width: 40px;
        min-height: 40px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main
    id="stage"
    aria-label="Cyber Dodger: Neon Run"
  >

    <canvas
      id="gameCanvas"
      aria-label="Cyber Dodger game field"
    ></canvas>

    <section
      id="hud"
      class="hud"
      aria-live="polite"
    >

      <div class="hud-cell">
        <span class="hud-label">
          Score
        </span>

        <span
          id="uiScore"
          class="hud-value"
        >
          0
        </span>
      </div>

      <div class="hud-cell">
        <span class="hud-label">
          Mult
        </span>

        <span
          id="uiMult"
          class="hud-value"
        >
          1.0x
        </span>
      </div>

      <div class="hud-cell">
        <span class="hud-label">
          Best
        </span>

        <span
          id="uiBest"
          class="hud-value"
        >
          0
        </span>
      </div>

    </section>

    <div class="top-actions">

      <button
        id="pauseBtn"
        class="icon-btn"
        type="button"
        aria-label="Pause game"
      >
        Pause
      </button>

      <button
        id="soundBtn"
        class="icon-btn"
        type="button"
        aria-label="Toggle sound"
      >
        Sound
      </button>

    </div>

    <div
      id="overlay"
      class="overlay open"
    >
      <div
        id="panel"
        class="panel"
      ></div>
    </div>

    <div
      id="adLayer"
      class="ad-layer"
      aria-live="polite"
    >

      <div class="ad-card">

        <div
          id="adTitle"
          class="ad-title"
        >
          Ad break
        </div>

        <div
          id="adCopy"
          class="ad-copy"
        >
          Syncing signal
        </div>

        <div
          class="ad-meter"
          aria-hidden="true"
        >
          <div
            id="adFill"
            class="ad-fill"
          ></div>
        </div>

        <p
          id="adNote"
          class="ad-note"
        >
          Local preview only.
        </p>

      </div>

    </div>

    <div
      id="toast"
      class="toast"
      aria-live="polite"
    ></div>

  </main>


  <script>
  (() => {

    "use strict";


    /* ==========================================================
       CONSTANTS
    ========================================================== */

    const LOGICAL_WIDTH =
      450;

    const LOGICAL_HEIGHT =
      650;

    const PLAYER_Y =
      568;

    const TAU =
      Math.PI * 2;

    const STORAGE_KEY =
      "cyber-dodger-neon-run-save-v2";

    const REVIVE_REWARD_ID =
      "cyber-dodger-revive-continue-v1";


    /* ==========================================================
       DEVICE / QUALITY
    ========================================================== */

    const IS_MOBILE =
      matchMedia(
        "(pointer: coarse)"
      ).matches;

    const REDUCED_MOTION =
      matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

    const LOW_FX =
      IS_MOBILE ||
      REDUCED_MOTION;


    /*
      Stare telefony dostają
      znacznie niższe limity.
    */

    const MAX_ITEMS =
      LOW_FX
        ? 56
        : 96;

    const MAX_PARTICLES =
      LOW_FX
        ? 120
        : 240;

    const MAX_SHOCKWAVES =
      LOW_FX
        ? 8
        : 16;

    const MAX_MESSAGES =
      LOW_FX
        ? 8
        : 14;

    const STAR_COUNT =
      LOW_FX
        ? 44
        : 84;

    const MAX_DPR =
      LOW_FX
        ? 1.5
        : 2;


    /* ==========================================================
       DOM
    ========================================================== */

    const canvas =
      document.getElementById(
        "gameCanvas"
      );

    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: false,
          desynchronized: true
        }
      );


    const overlay =
      document.getElementById(
        "overlay"
      );

    const panel =
      document.getElementById(
        "panel"
      );

    const toast =
      document.getElementById(
        "toast"
      );

    const adLayer =
      document.getElementById(
        "adLayer"
      );

    const adTitle =
      document.getElementById(
        "adTitle"
      );

    const adCopy =
      document.getElementById(
        "adCopy"
      );

    const adFill =
      document.getElementById(
        "adFill"
      );

    const adNote =
      document.getElementById(
        "adNote"
      );

    const uiScore =
      document.getElementById(
        "uiScore"
      );

    const uiMult =
      document.getElementById(
        "uiMult"
      );

    const uiBest =
      document.getElementById(
        "uiBest"
      );

    const soundBtn =
      document.getElementById(
        "soundBtn"
      );

    const pauseBtn =
      document.getElementById(
        "pauseBtn"
      );


    /* ==========================================================
       COLORS
    ========================================================== */

    const colors = {

      cyan:
        "#12f7ff",

      blue:
        "#4fa8ff",

      pink:
        "#ff2c9c",

      green:
        "#6dff73",

      yellow:
        "#ffe66d",

      red:
        "#ff315d",

      violet:
        "#8f5cff",

      ink:
        "#f3fbff",

      bg:
        "#060712"

    };


    /* ==========================================================
       GAME STATE
    ========================================================== */

    const game = {

      state:
        "boot",

      score:
        0,

      best:
        0,

      runs:
        0,

      multiplier:
        1,

      combo:
        0,

      comboTimer:
        0,

      survival:
        0,

      speedScale:
        1,

      spawnTimer:
        0.35,

      items:
        [],

      particles:
        [],

      stars:
        [],

      shockwaves:
        [],

      messages:
        [],


      player: {

        x:
          LOGICAL_WIDTH / 2,

        targetX:
          LOGICAL_WIDTH / 2,

        radius:
          22,

        lean:
          0,

        shield:
          0,

        invincible:
          0

      },


      input: {

        left:
          false,

        right:
          false,

        pointerActive:
          false

      },


      shake:
        0,

      shakeTime:
        0,

      flash:
        0,

      resizeDirty:
        true,

      canvasRect:
        null,

      revived:
        false,

      pausedBySystem:
        false,

      systemState:
        "menu",

      adActive:
        false,

      firstFrameSent:
        false,

      gameReadySent:
        false,

      lastScoreSent:
        0

    };


    /* ==========================================================
       AUDIO
    ========================================================== */

    const audio = {

      ctx:
        null,

      master:
        null,

      music:
        null,

      sfx:
        null,

      enabled:
        true,

      available:
        true,

      youtubeAllowsAudio:
        true,

      unlocked:
        false,

      unlocking:
        null,

      musicTimer:
        0,

      nextNoteTime:
        0,

      step:
        0,

      tempo:
        126,

      noiseBuffer:
        null

    };


    /* ==========================================================
       HELPERS
    ========================================================== */

    function rand(
      min,
      max
    ) {

      return (
        Math.random() *
        (
          max -
          min
        )
      ) +
      min;

    }


    function clamp(
      value,
      min,
      max
    ) {

      return Math.max(
        min,
        Math.min(
          max,
          value
        )
      );

    }


    function lerp(
      a,
      b,
      t
    ) {

      return (
        a +
        (
          b -
          a
        ) *
        t
      );

    }


    function easeOutCubic(
      t
    ) {

      return (
        1 -
        Math.pow(
          1 - t,
          3
        )
      );

    }


    /* ==========================================================
       YOUTUBE SDK
    ========================================================== */

    function getSDK() {

      return (
        typeof window.ytgame !==
        "undefined"
      )
        ? window.ytgame
        : null;

    }


    function inPlayables() {

      const sdk =
        getSDK();

      return Boolean(
        sdk &&
        sdk.IN_PLAYABLES_ENV
      );

    }


    function reportWarning(
      error
    ) {

      const sdk =
        getSDK();


      if (
        sdk &&
        sdk.health &&
        typeof sdk.health.logWarning ===
        "function"
      ) {

        try {

          sdk.health.logWarning();

        } catch (_) {}

      }

    }


    function reportError(
      error
    ) {

      const sdk =
        getSDK();


      if (
        sdk &&
        sdk.health &&
        typeof sdk.health.logError ===
        "function"
      ) {

        try {

          sdk.health.logError();

        } catch (_) {}

      }

    }


    /* ==========================================================
       SAVE / LOAD
    ========================================================== */

    async function loadSave() {

      let raw =
        "";


      const sdk =
        getSDK();


      if (
        sdk &&
        sdk.game &&
        typeof sdk.game.loadData ===
        "function"
      ) {

        try {

          raw =
            await sdk.game.loadData();

        } catch (
          error
        ) {

          reportWarning(
            error
          );

        }

      }


      if (!raw) {

        try {

          raw =
            localStorage.getItem(
              STORAGE_KEY
            ) ||
            "";

        } catch (
          error
        ) {

          reportWarning(
            error
          );

        }

      }


      if (!raw) {

        return;

      }


      try {

        const save =
          JSON.parse(
            raw
          );


        game.best =
          Number.isFinite(
            save.best
          )
            ? Math.max(
                0,
                Math.floor(
                  save.best
                )
              )
            : 0;


        game.runs =
          Number.isFinite(
            save.runs
          )
            ? Math.max(
                0,
                Math.floor(
                  save.runs
                )
              )
            : 0;

      } catch (
        error
      ) {

        reportWarning(
          error
        );

      }

    }

    /* ==========================================================
       AUDIO INITIALIZATION
    ========================================================== */

    function ensureAudio(
      allowCreate = false
    ) {

      if (
        audio.ctx
      ) {

        return audio.ctx;

      }


      if (
        !allowCreate ||
        !audio.available
      ) {

        return null;

      }


      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


      if (
        !AudioContext
      ) {

        audio.enabled =
          false;

        audio.available =
          false;

        updateSoundButton();

        return null;

      }


      let ac;


      try {

        ac =
          new AudioContext();

      } catch (
        error
      ) {

        audio.enabled =
          false;

        audio.available =
          false;

        updateSoundButton();

        reportWarning(
          error
        );

        return null;

      }


      const master =
        ac.createGain();

      const music =
        ac.createGain();

      const sfx =
        ac.createGain();

      const compressor =
        ac.createDynamicsCompressor();


      master.gain.value =
        0.78;


      music.gain.value =
        LOW_FX
          ? 0.13
          : 0.18;


      sfx.gain.value =
        LOW_FX
          ? 0.55
          : 0.68;


      compressor.threshold.value =
        -22;

      compressor.knee.value =
        18;

      compressor.ratio.value =
        7;

      compressor.attack.value =
        0.004;

      compressor.release.value =
        0.18;


      music.connect(
        master
      );

      sfx.connect(
        master
      );

      master.connect(
        compressor
      );

      compressor.connect(
        ac.destination
      );


      /*
        Noise buffer tylko raz.
      */

      const noiseLength =
        ac.sampleRate *
        (
          LOW_FX
            ? 0.5
            : 1.0
        );


      const buffer =
        ac.createBuffer(
          1,
          noiseLength,
          ac.sampleRate
        );


      const channel =
        buffer.getChannelData(
          0
        );


      for (
        let i = 0;
        i < noiseLength;
        i += 1
      ) {

        channel[i] =
          (
            Math.random() *
            2 -
            1
          ) *
          Math.pow(
            1 -
            i /
            noiseLength,
            1.8
          );

      }


      audio.ctx =
        ac;

      audio.master =
        master;

      audio.music =
        music;

      audio.sfx =
        sfx;

      audio.noiseBuffer =
        buffer;


      updateAudioGains();


      return ac;

    }


    function audioIsAudible() {

      return (
        audio.available &&
        audio.enabled &&
        audio.youtubeAllowsAudio
      );

    }


    function updateAudioGains() {

      if (
        !audio.master ||
        !audio.ctx
      ) {

        return;

      }


      const target =
        audioIsAudible()
          ? 0.78
          : 0;


      audio.master.gain
        .cancelScheduledValues(
          audio.ctx.currentTime
        );


      audio.master.gain
        .setTargetAtTime(
          target,
          audio.ctx.currentTime,
          0.025
        );


      if (
        !audioIsAudible()
      ) {

        stopMusic();

      }

    }


    function updateSoundButton() {

      const audible =
        audioIsAudible();


      soundBtn.textContent =
        audible
          ? "Sound"
          : "Muted";


      soundBtn.setAttribute(
        "aria-label",

        audible
          ? "Mute sound"
          : "Unmute sound"
      );

    }


    /* ==========================================================
       AUDIO TONE
    ========================================================== */

    function makeTone(
      freq,
      start,
      duration,
      type,
      gainValue,
      destination,
      slideTo
    ) {

      const ac =
        ensureAudio(
          false
        );


      if (
        !ac ||
        !destination ||
        !audioIsAudible()
      ) {

        return;

      }


      const osc =
        ac.createOscillator();


      const gain =
        ac.createGain();


      osc.type =
        type;


      osc.frequency
        .setValueAtTime(
          freq,
          start
        );


      if (
        slideTo
      ) {

        osc.frequency
          .exponentialRampToValueAtTime(
            Math.max(
              20,
              slideTo
            ),

            start +
            duration
          );

      }


      gain.gain
        .setValueAtTime(
          0.0001,
          start
        );


      gain.gain
        .exponentialRampToValueAtTime(
          gainValue,
          start +
          0.012
        );


      gain.gain
        .exponentialRampToValueAtTime(
          0.0001,
          start +
          duration
        );


      osc.connect(
        gain
      );


      gain.connect(
        destination
      );


      osc.onended =
        () => {

          try {

            osc.disconnect();

            gain.disconnect();

          } catch (_) {}

        };


      osc.start(
        start
      );


      osc.stop(
        start +
        duration +
        0.035
      );

    }


    /* ==========================================================
       FILTERED TONE
    ========================================================== */

    function makeFilteredTone(
      freq,
      start,
      duration,
      type,
      gainValue,
      filterFreq,
      q
    ) {

      const ac =
        ensureAudio(
          false
        );


      if (
        !ac ||
        !audioIsAudible()
      ) {

        return;

      }


      const filter =
        ac.createBiquadFilter();


      filter.type =
        "lowpass";


      filter.frequency
        .setValueAtTime(
          filterFreq,
          start
        );


      filter.Q.value =
        q;


      filter.connect(
        audio.sfx
      );


      makeTone(
        freq,
        start,
        duration,
        type,
        gainValue,
        filter,
        freq *
        1.04
      );


      window.setTimeout(
        () => {

          try {

            filter.disconnect();

          } catch (_) {}

        },
        Math.ceil(
          (
            duration +
            0.1
          ) *
          1000
        )
      );

    }


    /* ==========================================================
       NOISE
    ========================================================== */

    function playNoise(
      start,
      duration,
      gainValue,
      filterType,
      filterStart,
      filterEnd
    ) {

      const ac =
        ensureAudio(
          false
        );


      if (
        !ac ||
        !audio.noiseBuffer ||
        !audioIsAudible()
      ) {

        return;

      }


      const src =
        ac.createBufferSource();


      const gain =
        ac.createGain();


      const filter =
        ac.createBiquadFilter();


      src.buffer =
        audio.noiseBuffer;


      filter.type =
        filterType;


      filter.frequency
        .setValueAtTime(
          filterStart,
          start
        );


      filter.frequency
        .exponentialRampToValueAtTime(
          Math.max(
            80,
            filterEnd
          ),
          start +
          duration
        );


      gain.gain
        .setValueAtTime(
          gainValue,
          start
        );


      gain.gain
        .exponentialRampToValueAtTime(
          0.0001,
          start +
          duration
        );


      src.connect(
        filter
      );

      filter.connect(
        gain
      );

      gain.connect(
        audio.sfx
      );


      src.onended =
        () => {

          try {

            src.disconnect();

            filter.disconnect();

            gain.disconnect();

          } catch (_) {}

        };


      src.start(
        start
      );


      src.stop(
        start +
        duration +
        0.02
      );

    }


    /* ==========================================================
       MUSIC
    ========================================================== */

    function startMusic() {

      const ac =
        ensureAudio(
          false
        );


      if (
        !ac ||
        !audioIsAudible() ||
        audio.musicTimer
      ) {

        return;

      }


      audio.nextNoteTime =
        ac.currentTime +
        0.05;


      audio.step =
        audio.step %
        32;


      audio.musicTimer =
        window.setInterval(
          scheduleMusic,
          LOW_FX
            ? 140
            : 80
        );


      scheduleMusic();

    }


    function stopMusic() {

      if (
        audio.musicTimer
      ) {

        clearInterval(
          audio.musicTimer
        );

        audio.musicTimer =
          0;

      }

    }


    function scheduleMusic() {

      const ac =
        ensureAudio(
          false
        );


      if (
        !ac ||
        !audioIsAudible()
      ) {

        stopMusic();

        return;

      }


      const lookAhead =
        0.24;


      const stepDur =
        60 /
        audio.tempo /
        4;


      const bass = [
        55,
        55,
        82.41,
        73.42,
        55,
        65.41,
        82.41,
        98
      ];


      const lead =
        LOW_FX
          ? [
              440,
              0,
              523.25,
              0,
              659.25,
              0,
              587.33,
              0
            ]
          : [
              440,
              0,
              523.25,
              0,
              659.25,
              0,
              587.33,
              0,
              783.99,
              0,
              659.25,
              0,
              523.25,
              0,
              493.88,
              0
            ];


      while (
        audio.nextNoteTime <
        ac.currentTime +
        lookAhead
      ) {

        const step =
          audio.step;


        const t =
          audio.nextNoteTime;


        if (
          step % 4 ===
          0
        ) {

          const note =
            bass[
              (
                step /
                4
              ) %
              bass.length
            ];


          makeTone(
            note,
            t,
            stepDur *
            2.5,
            "sawtooth",
            LOW_FX
              ? 0.045
              : 0.075,
            audio.music,
            note *
            0.995
          );


          if (
            !LOW_FX
          ) {

            makeTone(
              note * 2,
              t +
              0.015,
              stepDur *
              1.35,
              "triangle",
              0.020,
              audio.music,
              note *
              2.01
            );

          }

        }


        const leadNote =
          lead[
            step %
            lead.length
          ];


        if (
          leadNote &&
          step % 2 ===
          0
        ) {

          const note =
            leadNote *
            (
              step % 8 ===
              0
                ? 0.5
                : 1
            );


          makeTone(
            note,
            t,
            stepDur *
            0.78,
            "square",
            LOW_FX
              ? 0.012
              : 0.022,
            audio.music,
            note *
            1.01
          );

        }


        /*
          Noise tylko desktop.
          To mocno odciąża starsze telefony.
        */

        if (
          !LOW_FX &&
          step % 2 ===
          1
        ) {

          playNoise(
            t,
            0.045,
            0.018,
            "highpass",
            5600,
            9200
          );

        }


        if (
          !LOW_FX &&
          step % 16 ===
          12
        ) {

          makeTone(
            220,
            t,
            stepDur *
            3.3,
            "triangle",
            0.025,
            audio.music,
            329.63
          );

        }


        audio.step =
          (
            audio.step +
            1
          ) %
          32;


        audio.nextNoteTime +=
          stepDur;

      }

    }

    /* ==========================================================
       AUDIO UNLOCK
    ========================================================== */

    function playSilentUnlockPulse(
      ac
    ) {

      if (
        !ac ||
        !audio.master
      ) {

        return;

      }


      const gain =
        ac.createGain();


      const osc =
        ac.createOscillator();


      const start =
        ac.currentTime;


      gain.gain
        .setValueAtTime(
          0.0001,
          start
        );


      gain.gain
        .exponentialRampToValueAtTime(
          0.00001,
          start +
          0.03
        );


      osc.frequency
        .setValueAtTime(
          440,
          start
        );


      osc.connect(
        gain
      );

      gain.connect(
        audio.master
      );


      osc.onended =
        () => {

          try {

            osc.disconnect();

            gain.disconnect();

          } catch (_) {}

        };


      osc.start(
        start
      );


      osc.stop(
        start +
        0.035
      );

    }


    function unlockAudioFromGesture() {

      const ac =
        ensureAudio(
          true
        );


      if (
        !ac ||
        !audio.enabled
      ) {

        stopMusic();

        return Promise.resolve(
          false
        );

      }


      updateAudioGains();


      playSilentUnlockPulse(
        ac
      );


      const resumePromise =
        ac.state ===
        "suspended"

          ? ac.resume()

          : Promise.resolve();


      audio.unlocking =
        resumePromise
          .then(
            () => {

              audio.unlocked =
                true;


              updateAudioGains();


              if (
                audioIsAudible()
              ) {

                startMusic();

              }


              updateSoundButton();


              return true;

            }
          )
          .catch(
            error => {

              reportWarning(
                error
              );


              stopMusic();


              return false;

            }
          );


      return audio.unlocking;

    }


    function resumeAudio() {

      const ac =
        ensureAudio(
          false
        );


      if (
        !ac ||
        !audio.enabled
      ) {

        stopMusic();

        return Promise.resolve(
          false
        );

      }


      updateAudioGains();


      const promise =
        ac.state ===
        "suspended"

          ? ac.resume()

          : Promise.resolve();


      return promise
        .then(
          () => {

            if (
              audioIsAudible()
            ) {

              startMusic();

            } else {

              stopMusic();

            }


            return true;

          }
        )
        .catch(
          error => {

            reportWarning(
              error
            );


            stopMusic();


            return false;

          }
        );

    }


    function suspendAudio() {

      stopMusic();


      if (
        audio.ctx &&
        audio.ctx.state ===
        "running"
      ) {

        audio.ctx
          .suspend()
          .catch(
            reportWarning
          );

      }

    }


    /* ==========================================================
       SDK HOOKS
    ========================================================== */

    function initSDKHooks() {

      const sdk =
        getSDK();


      if (
        !sdk ||
        !sdk.system
      ) {

        return;

      }


      try {

        if (
          typeof
          sdk.system
            .isAudioEnabled ===
          "function"
        ) {

          audio.youtubeAllowsAudio =
            Boolean(
              sdk.system
                .isAudioEnabled()
            );


          updateAudioGains();

        }

      } catch (
        error
      ) {

        reportWarning(
          error
        );

      }


      try {

        if (
          typeof
          sdk.system
            .onAudioEnabledChange ===
          "function"
        ) {

          sdk.system
            .onAudioEnabledChange(
              (
                isEnabled
              ) => {

                audio.youtubeAllowsAudio =
                  Boolean(
                    isEnabled
                  );


                updateAudioGains();


                if (
                  audio.youtubeAllowsAudio
                ) {

                  void resumeAudio();

                } else {

                  stopMusic();

                }


                updateSoundButton();

              }
            );

        }

      } catch (
        error
      ) {

        reportWarning(
          error
        );

      }


      try {

        if (
          typeof
          sdk.system
            .onPause ===
          "function"
        ) {

          sdk.system
            .onPause(
              () => {

                game.pausedBySystem =
                  true;

                game.systemState =
                  game.state;


                if (
                  game.state ===
                  "playing"
                ) {

                  game.state =
                    "paused";

                }


                stopGameLoop();

                void saveGame();

                suspendAudio();

              }
            );

        }

      } catch (
        error
      ) {

        reportWarning(
          error
        );

      }


      try {

        if (
          typeof
          sdk.system
            .onResume ===
          "function"
        ) {

          sdk.system
            .onResume(
              () => {

                if (
                  game.pausedBySystem
                ) {

                  if (
                    game.systemState ===
                    "playing" &&
                    game.state ===
                    "paused"
                  ) {

                    game.state =
                      "playing";

                  }


                  game.pausedBySystem =
                    false;


                  startGameLoop();

                  void resumeAudio();

                }

              }
            );

        }

      } catch (
        error
      ) {

        reportWarning(
          error
        );

      }

    }


    /* ==========================================================
       RESIZE
    ========================================================== */

    function resizeCanvas() {

      if (
        !game.resizeDirty
      ) {

        return;

      }


      const rect =
        canvas.getBoundingClientRect();


      const dpr =
        Math.min(
          window.devicePixelRatio ||
          1,

          MAX_DPR
        );


      const width =
        Math.max(
          1,
          Math.round(
            rect.width *
            dpr
          )
        );


      const height =
        Math.max(
          1,
          Math.round(
            rect.height *
            dpr
          )
        );


      if (
        canvas.width !==
        width ||
        canvas.height !==
        height
      ) {

        canvas.width =
          width;

        canvas.height =
          height;

      }


      game.canvasRect =
        rect;


      game.resizeDirty =
        false;

    }

    /* ==========================================================
       ADS
    ========================================================== */

    async function requestPlayableAd(
      type
    ) {

      const sdk =
        getSDK();


      /*
        W prawdziwym Playables
        korzystamy tylko z SDK.

        Nie ma lokalnego fake ad
        w środowisku produkcyjnym.
      */

      if (
        inPlayables()
      ) {

        if (
          !sdk ||
          !sdk.ads
        ) {

          return false;

        }


        try {

          if (
            type ===
            "rewarded" &&
            typeof
            sdk.ads
              .requestRewardedAd ===
            "function"
          ) {

            return Boolean(
              await sdk.ads
                .requestRewardedAd(
                  REVIVE_REWARD_ID
                )
            );

          }


          if (
            type ===
            "interstitial" &&
            typeof
            sdk.ads
              .requestInterstitialAd ===
            "function"
          ) {

            await sdk.ads
              .requestInterstitialAd();


            return true;

          }

        } catch (
          error
        ) {

          reportWarning(
            error
          );

          return false;

        }


        return false;

      }


      /*
        Poza Playables
        zostawiamy testową
        symulację.
      */

      return simulateAd(
        type
      );

    }


    function simulateAd(
      type
    ) {

      game.adActive =
        true;


      adLayer.classList.add(
        "open"
      );


      adFill.style.width =
        "0%";


      adTitle.textContent =
        type ===
        "rewarded"

          ? "Rewarded ad"

          : "Interstitial ad";


      adCopy.textContent =
        type ===
        "rewarded"

          ? "Revive loading"

          : "Break loading";


      adNote.textContent =
        "Local test mode. Real Playables uses the YouTube SDK.";


      return new Promise(
        resolve => {

          const duration =
            type ===
            "rewarded"

              ? 1500

              : 1100;


          const start =
            performance.now();


          const tick =
            now => {

              const t =
                clamp(
                  (
                    now -
                    start
                  ) /
                  duration,

                  0,
                  1
                );


              adFill.style.width =
                `${Math.round(
                  easeOutCubic(t) *
                  100
                )}%`;


              if (
                t >= 1
              ) {

                adLayer
                  .classList
                  .remove(
                    "open"
                  );


                game.adActive =
                  false;


                resolve(
                  true
                );


                return;

              }


              requestAnimationFrame(
                tick
              );

            };


          requestAnimationFrame(
            tick
          );

        }
      );

    }


    async function handleRewardedRevive() {

      game.player.shield =

    /* ==========================================================
       OBJECTS
    ========================================================== */

    function spawnMessage(
      text,
      x,
      y,
      color
    ) {

      if (
        game.messages.length >=
        MAX_MESSAGES
      ) {

        game.messages.shift();

      }


      game.messages.push({

        text,

        x,

        y,

        color,

        life:
          0.8,

        maxLife:
          0.8,

        vy:
          -36

      });

    }


    function burst(
      x,
      y,
      color,
      count,
      force
    ) {

      const available =
        MAX_PARTICLES -
        game.particles.length;


      const total =
        Math.max(
          0,
          Math.min(
            count,
            available
          )
        );


      for (
        let i = 0;
        i < total;
        i += 1
      ) {

        const angle =
          rand(
            0,
            TAU
          );


        const speed =
          rand(
            force * 0.22,
            force
          );


        game.particles.push({

          x,

          y,

          vx:
            Math.cos(angle) *
            speed,

          vy:
            Math.sin(angle) *
            speed -
            rand(
              20,
              80
            ),

          life:
            rand(
              0.35,
              0.85
            ),

          maxLife:
            0.85,

          size:
            rand(
              1.4,
              4.2
            ),

          color,

          drag:
            rand(
              0.88,
              0.96
            )

        });

      }

    }


    function shockwave(
      x,
      y,
      color,
      radius
    ) {

      if (
        game.shockwaves.length >=
        MAX_SHOCKWAVES
      ) {

        game.shockwaves.shift();

      }


      game.shockwaves.push({

        x,

        y,

        color,

        radius,

        age:
          0,

        life:
          0.48

      });

    }


    function addShake(
      amount,
      duration
    ) {

      game.shake =
        Math.max(
          game.shake,
          amount
        );


      game.shakeTime =
        Math.max(
          game.shakeTime,
          duration
