<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>Cyber Dodge</title>

<style>
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #071018;
  font-family: Arial, Helvetica, sans-serif;
  touch-action: none;
  overscroll-behavior: none;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#hud {
  position: absolute;
  top: max(16px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  right: max(16px, env(safe-area-inset-right));

  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  pointer-events: none;
}

.panel {
  background: rgba(0, 12, 20, 0.72);
  border: 1px solid rgba(87, 255, 180, 0.3);
  border-radius: 14px;
  padding: 10px 14px;
  min-width: 110px;

  backdrop-filter: blur(8px);
}

.label {
  color: #8da8b5;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}

.value {
  color: #ffffff;
  font-size: 24px;
  font-weight: 900;
  margin-top: 2px;
}

#overlay {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    max(20px, env(safe-area-inset-top))
    max(20px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom))
    max(20px, env(safe-area-inset-left));

  background:
    radial-gradient(
      circle at center,
      rgba(12, 37, 51, 0.4),
      rgba(0, 5, 10, 0.86)
    );

  pointer-events: auto;
}

.card {
  width: min(420px, 100%);
  text-align: center;

  padding: 32px 24px;

  border-radius: 24px;

  background:
    linear-gradient(
      180deg,
      rgba(17, 42, 57, 0.96),
      rgba(5, 15, 24, 0.96)
    );

  border:
    1px solid
    rgba(87, 255, 180, 0.28);

  box-shadow:
    0 20px 80px rgba(0, 0, 0, 0.55);
}

h1 {
  margin: 0 0 12px;

  color: #75ffb5;

  font-size: clamp(34px, 8vw, 56px);
  line-height: 1;

  letter-spacing: 2px;
}

p {
  margin: 0 0 24px;

  color: #c7d5db;

  font-size: 16px;
  line-height: 1.45;
}

button {
  width: 100%;

  border: 0;
  border-radius: 16px;

  padding: 18px 20px;

  background:
    linear-gradient(
      180deg,
      #63f7a5,
      #24bd72
    );

  color: #04110a;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;

  touch-action: manipulation;

  box-shadow:
    0 8px 30px
    rgba(40, 220, 120, 0.22);
}

button:active {
  transform: scale(0.98);
}

#hint {
  margin-top: 16px;
  color: #7f969f;
  font-size: 13px;
}
</style>

<!-- YouTube Playables SDK MUST load before game code -->
<script src="https://www.youtube.com/game_api/v1"></script>
</head>

<body>

<div id="app">

  <canvas id="gameCanvas"></canvas>

  <div id="ui">

    <div id="hud">

      <div class="panel">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>

      <div class="panel">
        <div class="label">BEST</div>
        <div class="value" id="best">0</div>
      </div>

    </div>

    <div id="overlay">

      <div class="card">

        <h1 id="title">CYBER DODGE</h1>

        <p id="message">
          Move left and right.<br>
          Avoid the red viruses.
        </p>

        <button id="startButton">
          START GAME
        </button>

        <div id="hint">
          Touch, drag, mouse or arrow keys
        </div>

      </div>

    </div>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   CONSTANTS
========================================================= */

const LOGICAL_WIDTH = 390;
const LOGICAL_HEIGHT = 780;

const PLAYER_Y = 680;

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext(
    "2d",
    {
      alpha: false,
      desynchronized: true
    }
  );

const overlay =
  document.getElementById("overlay");

const title =
  document.getElementById("title");

const message =
  document.getElementById("message");

const startButton =
  document.getElementById("startButton");

const scoreElement =
  document.getElementById("score");

const bestElement =
  document.getElementById("best");


/* =========================================================
   HELPERS
========================================================= */

function clamp(value, min, max) {
  return Math.max(
    min,
    Math.min(max, value)
  );
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function distanceSquared(
  ax,
  ay,
  bx,
  by
) {
  const dx = ax - bx;
  const dy = ay - by;

  return dx * dx + dy * dy;
}


/* =========================================================
   CANVAS / RESPONSIVE
========================================================= */

let dpr = 1;
let scale = 1;
let offsetX = 0;
let offsetY = 0;

function resizeCanvas() {

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;

  dpr = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width =
    Math.max(
      1,
      Math.floor(width * dpr)
    );

  canvas.height =
    Math.max(
      1,
      Math.floor(height * dpr)
    );

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";

  scale =
    Math.min(
      width / LOGICAL_WIDTH,
      height / LOGICAL_HEIGHT
    );

  offsetX =
    (width - LOGICAL_WIDTH * scale) * 0.5;

  offsetY =
    (height - LOGICAL_HEIGHT * scale) * 0.5;
}

window.addEventListener(
  "resize",
  resizeCanvas,
  { passive: true }
);

resizeCanvas();


/* =========================================================
   GAME STATE
========================================================= */

const game = {

  state: "menu",

  pausedByYouTube: false,

  running: false,

  time: 0,

  score: 0,

  best: 0,

  spawnTimer: 0,

  survival: 0,

  speedScale: 1,

  items: [],

  particles: [],

  input: {
    left: false,
    right: false,
    pointerActive: false,
    pointerX: LOGICAL_WIDTH * 0.5
  },

  player: {
    x: LOGICAL_WIDTH * 0.5,
    targetX: LOGICAL_WIDTH * 0.5,
    radius: 20,
    invincible: 0,
    shield: 0,
    lean: 0
  },

  audioEnabled: true,

  firstFrameSent: false,

  readySent: false,

  lastSaveTime: 0
};


/* =========================================================
   YOUTUBE PLAYABLES SDK
========================================================= */

function hasYTGame() {

  return (
    typeof window.ytgame !== "undefined" &&
    window.ytgame
  );
}


function sendFirstFrameReady() {

  if (
    game.firstFrameSent ||
    !hasYTGame()
  ) {
    return;
  }

  try {

    if (
      ytgame.game &&
      typeof ytgame.game.firstFrameReady === "function"
    ) {

      ytgame.game.firstFrameReady();

      game.firstFrameSent = true;
    }

  } catch (error) {
  }
}


function sendGameReady() {

  if (
    game.readySent ||
    !hasYTGame()
  ) {
    return;
  }

  try {

    if (
      ytgame.game &&
      typeof ytgame.game.gameReady === "function"
    ) {

      ytgame.game.gameReady();

      game.readySent = true;
    }

  } catch (error) {
  }
}


async function saveGame() {

  const now =
    performance.now();

  if (
    now - game.lastSaveTime < 1000
  ) {
    return;
  }

  game.lastSaveTime = now;

  const data = JSON.stringify({
    version: 1,
    best: Math.floor(game.best)
  });

  if (
    hasYTGame() &&
    ytgame.game &&
    typeof ytgame.game.saveData === "function"
  ) {

    try {

      await ytgame.game.saveData(data);

      return;

    } catch (error) {
    }
  }

  try {

    localStorage.setItem(
      "cyber_dodge_save",
      data
    );

  } catch (error) {
  }
}


async function loadGame() {

  let data = null;

  if (
    hasYTGame() &&
    ytgame.game &&
    typeof ytgame.game.loadData === "function"
  ) {

    try {

      data =
        await ytgame.game.loadData();

    } catch (error) {
    }
  }

  if (!data) {

    try {

      data =
        localStorage.getItem(
          "cyber_dodge_save"
        );

    } catch (error) {
    }
  }

  if (!data) {
    return;
  }

  try {

    const parsed =
      JSON.parse(data);

    if (
      Number.isFinite(parsed.best)
    ) {

      game.best =
        Math.max(
          0,
          parsed.best
        );
    }

  } catch (error) {
  }

  updateHUD();
}


function setupYouTubeCallbacks() {

  if (!hasYTGame()) {
    return;
  }

  try {

    if (
      ytgame.system &&
      typeof ytgame.system.isAudioEnabled === "function"
    ) {

      game.audioEnabled =
        ytgame.system.isAudioEnabled();
    }

  } catch (error) {
  }


  try {

    if (
      ytgame.system &&
      typeof ytgame.system.onAudioEnabledChange === "function"
    ) {

      ytgame.system.onAudioEnabledChange(
        function(enabled) {

          game.audioEnabled =
            !!enabled;
        }
      );
    }

  } catch (error) {
  }


  try {

    if (
      ytgame.system &&
      typeof ytgame.system.onPause === "function"
    ) {

      ytgame.system.onPause(
        function() {

          game.pausedByYouTube = true;

          saveGame();
        }
      );
    }

  } catch (error) {
  }


  try {

    if (
      ytgame.system &&
      typeof ytgame.system.onResume === "function"
    ) {

      ytgame.system.onResume(
        function() {

          game.pausedByYouTube = false;

          lastFrameTime =
            performance.now();
        }
      );
    }

  } catch (error) {
  }
}


/* =========================================================
   GAME RESET
========================================================= */

function resetGame() {

  game.score = 0;

  game.survival = 0;

  game.speedScale = 1;

  game.spawnTimer = 0.15;

  game.items.length = 0;

  game.particles.length = 0;

  game.player.x =
    LOGICAL_WIDTH * 0.5;

  game.player.targetX =
    LOGICAL_WIDTH * 0.5;

  game.player.radius = 20;

  game.player.invincible = 1;

  game.player.shield = 0;

  game.player.lean = 0;

  updateHUD();
}


/* =========================================================
   SPAWN SYSTEM
========================================================= */

function spawnItem(
  type,
  x,
  y = -50
) {

  const baseSpeed =
    rand(175, 235) *
    game.speedScale;

  const item = {

    type: type,

    x: x,

    baseX: x,

    y: y,

    radius:
      type === "virus"
        ? rand(20, 26)
        : type === "shield"
          ? 16
          : rand(11, 15),

    speed:
      type === "virus"
        ? baseSpeed * rand(1.0, 1.2)
        : baseSpeed * rand(0.86, 1.05),

    drift:
      type === "virus"
        ? rand(5, 20)
        : rand(2, 10),

    phase:
      rand(0, Math.PI * 2),

    age: 0,

    rot:
      rand(0, Math.PI * 2),

    spin:
      type === "virus"
        ? rand(-3.5, 3.5)
        : rand(-2, 2),

    value:
      type === "data"
        ? Math.round(rand(10, 18))
        : 0
  };

  game.items.push(item);
}


/*
  GUARANTEED OBSTACLE SPAWN
*/

function spawnWave() {

  const margin = 45;

  const firstX =
    rand(
      margin,
      LOGICAL_WIDTH - margin
    );

  /*
    Always spawn one obstacle.
    This prevents the "no obstacles" bug.
  */

  spawnItem(
    "virus",
    firstX
  );


  /*
    Additional obstacle
  */

  if (
    game.survival > 6 &&
    Math.random() < 0.38
  ) {

    let secondX =
      rand(
        margin,
        LOGICAL_WIDTH - margin
      );

    if (
      Math.abs(
        secondX - firstX
      ) < 85
    ) {

      if (
        secondX <
        LOGICAL_WIDTH * 0.5
      ) {

        secondX += 110;

      } else {

        secondX -= 110;
      }
    }

    secondX =
      clamp(
        secondX,
        margin,
        LOGICAL_WIDTH - margin
      );

    spawnItem(
      "virus",
      secondX,
      -120
    );
  }


  /*
    Collectible
  */

  if (
    Math.random() < 0.72
  ) {

    let dataX =
      rand(
        margin,
        LOGICAL_WIDTH - margin
      );

    if (
      Math.abs(
        dataX - firstX
      ) < 55
    ) {

      dataX =
        clamp(
          dataX +
          (
            Math.random() < 0.5
              ? -90
              : 90
          ),
          margin,
          LOGICAL_WIDTH - margin
        );
    }

    spawnItem(
      "data",
      dataX,
      -80
    );
  }


  /*
    Rare shield
  */

  if (
    game.survival > 10 &&
    game.player.shield < 1 &&
    Math.random() < 0.09
  ) {

    spawnItem(
      "shield",
      rand(
        margin,
        LOGICAL_WIDTH - margin
      ),
      -160
    );
  }
}


function forceInitialObstacles() {

  /*
    Guaranteed visible obstacles.
  */

  spawnItem(
    "virus",
    LOGICAL_WIDTH * 0.25,
    80
  );

  spawnItem(
    "virus",
    LOGICAL_WIDTH * 0.5,
    -40
  );

  spawnItem(
    "virus",
    LOGICAL_WIDTH * 0.75,
    -150
  );

  spawnItem(
    "data",
    LOGICAL_WIDTH * 0.38,
    140
  );
}


/* =========================================================
   PARTICLES
========================================================= */

function burst(
  x,
  y,
  amount
) {

  const count =
    Math.min(
      amount,
      24
    );

  for (
    let i = 0;
    i < count;
    i++
  ) {

    const angle =
      Math.random() *
      Math.PI * 2;

    const speed =
      rand(50, 170);

    game.particles.push({

      x: x,
      y: y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:
        rand(0.25, 0.65),

      maxLife: 0.65,

      size:
        rand(2, 5)
    });
  }

  /*
    Hard particle cap for mobile.
  */

  if (
    game.particles.length > 120
  ) {

    game.particles.splice(
      0,
      game.particles.length - 120
    );
  }
}


/* =========================================================
   INPUT
========================================================= */

function screenToGameX(
  clientX
) {

  const rect =
    canvas.getBoundingClientRect();

  const x =
    clientX - rect.left;

  return clamp(
    (x - offsetX) / scale,
    0,
    LOGICAL_WIDTH
  );
}


function setPointerX(
  clientX
) {

  game.input.pointerX =
    screenToGameX(clientX);

  game.player.targetX =
    game.input.pointerX;
}


canvas.addEventListener(
  "pointerdown",
  function(event) {

    if (
      game.state !== "playing"
    ) {
      return;
    }

    game.input.pointerActive =
      true;

    setPointerX(
      event.clientX
    );

    try {

      canvas.setPointerCapture(
        event.pointerId
      );

    } catch (error) {
    }

    event.preventDefault();
  },
  { passive: false }
);


canvas.addEventListener(
  "pointermove",
  function(event) {

    if (
      !game.input.pointerActive ||
      game.state !== "playing"
    ) {
      return;
    }

    setPointerX(
      event.clientX
    );

    event.preventDefault();
  },
  { passive: false }
);


function releasePointer() {

  game.input.pointerActive =
    false;
}

canvas.addEventListener(
  "pointerup",
  releasePointer,
  { passive: true }
);

canvas.addEventListener(
  "pointercancel",
  releasePointer,
  { passive: true }
);


window.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "ArrowLeft" ||
      event.key === "a" ||
      event.key === "A"
    ) {

      game.input.left = true;

      event.preventDefault();
    }

    if (
      event.key === "ArrowRight" ||
      event.key === "d" ||
      event.key === "D"
    ) {

      game.input.right = true;

      event.preventDefault();
    }
  }
);


window.addEventListener(
  "keyup",
  function(event) {

    if (
      event.key === "ArrowLeft" ||
      event.key === "a" ||
      event.key === "A"
    ) {

      game.input.left = false;
    }

    if (
      event.key === "ArrowRight" ||
      event.key === "d" ||
      event.key === "D"
    ) {

      game.input.right = false;
    }
  }
);


/* =========================================================
   START / GAME OVER
========================================================= */

function startGame() {

  resetGame();

  forceInitialObstacles();

  game.state =
    "playing";

  overlay.style.display =
    "none";

  lastFrameTime =
    performance.now();
}


function gameOver() {

  if (
    game.state !== "playing"
  ) {
    return;
  }

  game.state =
    "gameover";

  burst(
    game.player.x,
    PLAYER_Y,
    24
  );

  const finalScore =
    Math.floor(
      game.score
    );

  if (
    finalScore > game.best
  ) {

    game.best =
      finalScore;
  }

  updateHUD();

  saveGame();

  /*
    Optional score submission
  */

  try {

    if (
      hasYTGame() &&
      ytgame.game &&
      typeof ytgame.game.sendScore === "function"
    ) {

      ytgame.game.sendScore(
        finalScore
      );
    }

  } catch (error) {
  }

  title.textContent =
    "GAME OVER";

  message.innerHTML =
    "Score: <b>" +
    finalScore +
    "</b><br>Best: <b>" +
    Math.floor(game.best) +
    "</b>";

  startButton.textContent =
    "PLAY AGAIN";

  overlay.style.display =
    "flex";
}


startButton.addEventListener(
  "click",
  function() {

    startGame();
  }
);


/* =========================================================
   UPDATE
========================================================= */

function updateGame(dt) {

  if (
    game.state !== "playing"
  ) {
    return;
  }

  game.survival += dt;

  game.speedScale =
    1 +
    Math.min(
      1.8,
      game.survival / 50
    );


  /*
    INPUT
  */

  if (
    !game.input.pointerActive
  ) {

    if (
      game.input.left
    ) {

      game.player.targetX -=
        390 * dt;
    }

    if (
      game.input.right
    ) {

      game.player.targetX +=
        390 * dt;
    }
  }

  game.player.targetX =
    clamp(
      game.player.targetX,
      30,
      LOGICAL_WIDTH - 30
    );


  const previousX =
    game.player.x;

  game.player.x =
    lerp(
      game.player.x,
      game.player.targetX,
      1 -
      Math.exp(-18 * dt)
    );

  game.player.lean =
    lerp(
      game.player.lean,
      clamp(
        (
          game.player.x -
          previousX
        ) * 0.75,
        -14,
        14
      ),
      1 -
      Math.exp(-12 * dt)
    );


  game.player.invincible =
    Math.max(
      0,
      game.player.invincible - dt
    );


  /*
    SPAWN
  */

  game.spawnTimer -= dt;

  const spawnDelay =
    clamp(
      0.82 -
      game.survival * 0.007,
      0.32,
      0.82
    );

  while (
    game.spawnTimer <= 0
  ) {

    spawnWave();

    game.spawnTimer +=
      spawnDelay *
      rand(0.85, 1.1);
  }


  /*
    ITEMS
  */

  const player =
    game.player;

  for (
    let i =
      game.items.length - 1;

    i >= 0;

    i--
  ) {

    const item =
      game.items[i];

    item.age += dt;

    item.y +=
      item.speed * dt;

    item.x =
      item.baseX +
      Math.sin(
        item.age * 2.1 +
        item.phase
      ) *
      item.drift;

    item.rot +=
      item.spin * dt;


    /*
      COLLISION
    */

    const hitDistance =
      player.radius +
      item.radius;

    const distSq =
      distanceSquared(
        item.x,
        item.y,
        player.x,
        PLAYER_Y
      );


    if (
      distSq <
      hitDistance * hitDistance
    ) {

      if (
        item.type === "data"
      ) {

        game.score +=
          item.value;

        burst(
          item.x,
          item.y,
          10
        );

        game.items.splice(
          i,
          1
        );

        continue;
      }


      if (
        item.type === "shield"
      ) {

        player.shield =
          Math.min(
            1,
            player.shield + 1
          );

        game.items.splice(
          i,
          1
        );

        continue;
      }


      if (
        item.type === "virus"
      ) {

        if (
          player.invincible > 0
        ) {

          game.items.splice(
            i,
            1
          );

          continue;
        }


        if (
          player.shield > 0
        ) {

          player.shield--;

          burst(
            item.x,
            item.y,
            20
          );

          game.items.splice(
            i,
            1
          );

          continue;
        }


        game.items.splice(
          i,
          1
        );

        gameOver();

        return;
      }
    }


    /*
      REMOVE OFFSCREEN
    */

    if (
      item.y >
      LOGICAL_HEIGHT +
      item.radius +
      60
    ) {

      game.items.splice(
        i,
        1
      );
    }
  }


  /*
    PARTICLES
  */

  for (
    let i =
      game.particles.length - 1;

    i >= 0;

    i--
  ) {

    const particle =
      game.particles[i];

    particle.life -= dt;

    particle.x +=
      particle.vx * dt;

    particle.y +=
      particle.vy * dt;

    particle.vx *=
      1 - dt * 1.8;

    particle.vy *=
      1 - dt * 1.8;

    if (
      particle.life <= 0
    ) {

      game.particles.splice(
        i,
        1
      );
    }
  }


  /*
    SCORE
  */

  game.score +=
    dt * 10;

  if (
    game.score >
    game.best
  ) {

    game.best =
      Math.floor(
        game.score
      );
  }

  updateHUD();
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

  ctx.fillStyle =
    "#071018";

  ctx.fillRect(
    0,
    0,
    LOGICAL_WIDTH,
    LOGICAL_HEIGHT
  );


  /*
    Moving grid
  */

  ctx.strokeStyle =
    "rgba(70,255,170,0.05)";

  ctx.lineWidth = 1;

  const gridOffset =
    (
      game.time * 45
    ) % 40;

  for (
    let y =
      -40 + gridOffset;

    y <
      LOGICAL_HEIGHT;

    y += 40
  ) {

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      LOGICAL_WIDTH,
      y
    );

    ctx.stroke();
  }


  for (
    let x = 0;

    x <= LOGICAL_WIDTH;

    x += 40
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      LOGICAL_HEIGHT
    );

    ctx.stroke();
  }
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

  const p =
    game.player;

  const blink =
    p.invincible > 0 &&
    Math.floor(
      game.time * 14
    ) % 2 === 0;

  if (blink) {
    return;
  }

  ctx.save();

  ctx.translate(
    p.x,
    PLAYER_Y
  );

  ctx.rotate(
    p.lean * 0.015
  );


  /*
    Shield
  */

  if (
    p.shield > 0
  ) {

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      32,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "rgba(90,220,255,0.9)";

    ctx.lineWidth = 3;

    ctx.stroke();
  }


  /*
    Ship
  */

  ctx.beginPath();

  ctx.moveTo(
    0,
    -26
  );

  ctx.lineTo(
    22,
    22
  );

  ctx.lineTo(
    0,
    14
  );

  ctx.lineTo(
    -22,
    22
  );

  ctx.closePath();

  ctx.fillStyle =
    "#66f7b2";

  ctx.fill();

  ctx.strokeStyle =
    "#d9fff0";

  ctx.lineWidth = 2;

  ctx.stroke();


  /*
    Engine
  */

  ctx.beginPath();

  ctx.moveTo(
    -8,
    18
  );

  ctx.lineTo(
    0,
    34 +
    Math.sin(game.time * 18) * 4
  );

  ctx.lineTo(
    8,
    18
  );

  ctx.closePath();

  ctx.fillStyle =
    "#2cdcff";

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   DRAW VIRUS
========================================================= */

function drawVirus(
  item
) {

  ctx.save();

  ctx.translate(
    item.x,
    item.y
  );

  ctx.rotate(
    item.rot
  );


  /*
    Glow
  */

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    item.radius * 1.25,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "rgba(255,55,85,0.15)";

  ctx.fill();


  /*
    Spikes
  */

  ctx.strokeStyle =
    "#ff4863";

  ctx.lineWidth = 3;

  for (
    let i = 0;

    i < 8;

    i++
  ) {

    const angle =
      i *
      Math.PI * 2 / 8;

    const x1 =
      Math.cos(angle) *
      item.radius;

    const y1 =
      Math.sin(angle) *
      item.radius;

    const x2 =
      Math.cos(angle) *
      item.radius * 1.35;

    const y2 =
      Math.sin(angle) *
      item.radius * 1.35;

    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.stroke();
  }


  /*
    Body
  */

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    item.radius,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#c82645";

  ctx.fill();

  ctx.strokeStyle =
    "#ff91a3";

  ctx.lineWidth = 2;

  ctx.stroke();


  /*
    Eyes
  */

  ctx.fillStyle =
    "#081018";

  ctx.beginPath();

  ctx.arc(
    -item.radius * 0.32,
    -item.radius * 0.1,
    item.radius * 0.14,
    0,
    Math.PI * 2
  );

  ctx.arc(
    item.radius * 0.32,
    -item.radius * 0.1,
    item.radius * 0.14,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   DRAW DATA
========================================================= */

function drawData(
  item
) {

  ctx.save();

  ctx.translate(
    item.x,
    item.y
  );

  ctx.rotate(
    item.rot
  );

  ctx.beginPath();

  ctx.moveTo(
    0,
    -item.radius * 1.4
  );

  ctx.lineTo(
    item.radius * 1.2,
    0
  );

  ctx.lineTo(
    0,
    item.radius * 1.4
  );

  ctx.lineTo(
    -item.radius * 1.2,
    0
  );

  ctx.closePath();

  ctx.fillStyle =
    "rgba(90,255,150,0.35)";

  ctx.fill();

  ctx.strokeStyle =
    "#72ffb0";

  ctx.lineWidth = 2;

  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   DRAW SHIELD
========================================================= */

function drawShield(
  item
) {

  ctx.save();

  ctx.translate(
    item.x,
    item.y
  );

  ctx.rotate(
    item.rot
  );

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    item.radius,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    "#4bdcff";

  ctx.lineWidth = 3;

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    item.radius * 0.55,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "rgba(70,220,255,0.35)";

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   DRAW ITEMS
========================================================= */

function drawItems() {

  for (
    let i = 0;

    i < game.items.length;

    i++
  ) {

    const item =
      game.items[i];

    if (
      item.type === "virus"
    ) {

      drawVirus(item);

    } else if (
      item.type === "data"
    ) {

      drawData(item);

    } else {

      drawShield(item);
    }
  }
}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles() {

  for (
    let i = 0;

    i < game.particles.length;

    i++
  ) {

    const p =
      game.particles[i];

    const alpha =
      clamp(
        p.life / p.maxLife,
        0,
        1
      );

    ctx.globalAlpha =
      alpha;

    ctx.fillStyle =
      "#8dffbd";

    ctx.fillRect(
      p.x - p.size * 0.5,
      p.y - p.size * 0.5,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha = 1;
}


/* =========================================================
   RENDER
========================================================= */

function render() {

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    canvas.width / dpr,
    canvas.height / dpr
  );


  ctx.save();

  ctx.translate(
    offsetX,
    offsetY
  );

  ctx.scale(
    scale,
    scale
  );

  drawBackground();

  drawItems();

  drawParticles();

  drawPlayer();

  ctx.restore();
}


/* =========================================================
   HUD
========================================================= */

let lastHUDScore = -1;
let lastHUDBest = -1;

function updateHUD() {

  const score =
    Math.floor(
      game.score
    );

  const best =
    Math.floor(
      game.best
    );

  if (
    score !== lastHUDScore
  ) {

    lastHUDScore =
      score;

    scoreElement.textContent =
      score;
  }

  if (
    best !== lastHUDBest
  ) {

    lastHUDBest =
      best;

    bestElement.textContent =
      best;
  }
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastFrameTime =
  performance.now();

function gameLoop(now) {

  requestAnimationFrame(
    gameLoop
  );


  if (
    game.pausedByYouTube
  ) {
    return;
  }


  let dt =
    (
      now -
      lastFrameTime
    ) / 1000;

  lastFrameTime =
    now;

  /*
    Prevent giant simulation jumps.
  */

  dt =
    Math.min(
      dt,
      0.05
    );

  game.time += dt;

  updateGame(dt);

  render();

  sendFirstFrameReady();
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize() {

  setupYouTubeCallbacks();

  await loadGame();

  title.textContent =
    "CYBER DODGE";

  message.innerHTML =
    "Move left and right.<br>Avoid the red viruses.";

  startButton.textContent =
    "START GAME";

  updateHUD();

  /*
    First visible frame will be rendered by game loop.
  */

  requestAnimationFrame(
    gameLoop
  );

  /*
    Menu is immediately interactive.
  */

  requestAnimationFrame(
    function() {

      sendGameReady();
    }
  );
}


initialize();

</script>
