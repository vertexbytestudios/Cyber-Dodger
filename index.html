    }


    /* ==========================================================
       SPAWN ITEM
    ========================================================== */

    function spawnItem(
      type,
      x
    ) {

      if (
        game.items.length >=
        MAX_ITEMS
      ) {

        /*
          Usuń najstarszy obiekt
          zamiast całkowicie blokować
          nowy spawn.
        */

        game.items.shift();

      }


      const speed =
        rand(
          138,
          206
        ) *
        game.speedScale;


      game.items.push({

        type,

        x,

        baseX:
          x,

        y:
          -28,

        radius:
          type ===
          "virus"

            ? rand(
                15,
                20
              )

            : type ===
              "shield"

              ? 13

              : rand(
                  9,
                  13
                ),

        speed:
          type ===
          "data"

            ? speed *
              rand(
                0.88,
                1.05
              )

            : speed *
              rand(
                0.96,
                1.18
              ),

        drift:
          type ===
          "virus"

            ? rand(
                8,
                28
              )

            : rand(
                4,
                16
              ),

        phase:
          rand(
            0,
            TAU
          ),

        age:
          0,

        rot:
          rand(
            0,
            TAU
          ),

        spin:
          type ===
          "virus"

            ? rand(
                -4.2,
                4.2
              )

            : rand(
                -2.4,
                2.4
              ),

        value:
          type ===
          "data"

            ? Math.round(
                rand(
                  10,
                  17
                )
              )

            : 0

      });

    }


    /* ==========================================================
       GUARANTEED WAVE
    ========================================================== */

    function spawnWave() {

      const margin =
        36;


      const firstX =
        rand(
          margin,
          LOGICAL_WIDTH -
          margin
        );


      /*
        Każda fala ma
        przynajmniej jednego wirusa.
      */

      spawnItem(
        "virus",
        firstX
      );


      /*
        Drugi wirus
        pojawia się później.
      */

      if (
        game.survival >
          6 &&
        Math.random() <
          (
            LOW_FX
              ? 0.18
              : 0.28
          )
      ) {

        let secondX =
          rand(
            margin,
            LOGICAL_WIDTH -
            margin
          );


        if (
          Math.abs(
            secondX -
            firstX
          ) < 80
        ) {

          secondX =
            clamp(
              secondX +
              (
                secondX <
                LOGICAL_WIDTH / 2
                  ? 100
                  : -100
              ),

              margin,

              LOGICAL_WIDTH -
              margin
            );

        }


        spawnItem(
          "virus",
          secondX
        );

      }


      /*
        Data.
      */

      if (
        Math.random() <
        0.68
      ) {

        let dataX =
          rand(
            margin,
            LOGICAL_WIDTH -
            margin
          );


        if (
          Math.abs(
            dataX -
            firstX
          ) <
          55
        ) {

          dataX =
            clamp(
              dataX +
              (
                dataX <
                LOGICAL_WIDTH / 2
                  ? 80
                  : -80
              ),

              margin,

              LOGICAL_WIDTH -
              margin
            );

        }


        spawnItem(
          "data",
          dataX
        );

      }


      /*
        Shield.
      */

      if (
        game.survival >
          9 &&
        game.player.shield <
          2 &&
        Math.random() <
          0.08
      ) {

        spawnItem(
          "shield",
          rand(
            margin,
            LOGICAL_WIDTH -
            margin
          )
        );

      }

    }


    /* ==========================================================
       UPDATE GAME
    ========================================================== */

    function updatePlaying(
      dt
    ) {

      game.survival +=
        dt;


      game.speedScale =
        1 +
        Math.min(
          1.75,
          game.survival /
          52
        );


      /*
        Spawn stabilny nawet
        po chwilowym spadku FPS.
      */

      game.spawnTimer -=
        dt;


      const spawnDelay =
        clamp(
          0.76 -
          game.survival *
          0.0055,

          0.34,
          0.76
        );


      while (
        game.spawnTimer <=
        0
      ) {

        spawnWave();


        game.spawnTimer +=
          spawnDelay *
          rand(
            0.82,
            1.10
          );

      }


      /* ========================================================
         PLAYER
      ======================================================== */

      const player =
        game.player;


      if (
        game.input.left
      ) {

        player.targetX -=
          380 *
          dt;

      }


      if (
        game.input.right
      ) {

        player.targetX +=
          380 *
          dt;

      }


      player.targetX =
        clamp(
          player.targetX,
          30,
          LOGICAL_WIDTH -
          30
        );


      const oldX =
        player.x;


      player.x =
        lerp(
          player.x,
          player.targetX,

          1 -
          Math.exp(
            -14 *
            dt
          )
        );


      player.lean =
        lerp(
          player.lean,

          clamp(
            (
              player.x -
              oldX
            ) *
            0.62,

            -13,
            13
          ),

          1 -
          Math.exp(
            -10 *
            dt
          )
        );


      player.invincible =
        Math.max(
          0,
          player.invincible -
          dt
        );


      /* ========================================================
         COMBO
      ======================================================== */

      if (
        game.comboTimer >
        0
      ) {

        game.comboTimer -=
          dt;

      }

      else if (
        game.combo >
        0
      ) {

        game.combo =
          Math.max(
            0,
            Math.floor(
              game.combo *
              0.55
            )
          );


        game.multiplier =
          1 +
          Math.min(
            4.2,
            game.combo *
            0.075
          );

      }


      /* ========================================================
         OBJECTS
      ======================================================== */

      for (
        let i =
          game.items.length -
          1;

        i >= 0;

        i--
      ) {

        const item =
          game.items[i];


        item.age +=
          dt;


        item.y +=
          item.speed *
          dt;


        item.x =
          item.baseX +
          Math.sin(
            item.age *
            2.3 +
            item.phase
          ) *
          item.drift;


        item.rot +=
          item.spin *
          dt;


        const dx =
          item.x -
          player.x;


        const dy =
          item.y -
          PLAYER_Y;


        const hitRadius =
          player.radius +
          item.radius;


        /*
          Szybsza kolizja:
          bez Math.hypot().
        */

        if (
          dx * dx +
          dy * dy <
          hitRadius *
          hitRadius
        ) {

          if (
            item.type ===
            "data"
          ) {

            collectData(
              item
            );


            game.items.splice(
              i,
              1
            );


            continue;

          }


          if (
            item.type ===
            "shield"
          ) {

            collectShield(
              item
            );


            game.items.splice(
              i,
              1
            );


            continue;

          }


          collideVirus(
            item
          );


          game.items.splice(
            i,
            1
          );


          if (
            game.state !==
            "playing"
          ) {

            return;

          }


          continue;

        }


        /*
          Usuwanie poza ekranem.
        */

        if (
          item.y >
          LOGICAL_HEIGHT +
          50
        ) {

          game.items.splice(
            i,
            1
          );


          if (
            item.type ===
            "data" &&
            game.combo >
            0
          ) {

            game.combo =
              Math.max(
                0,
                game.combo -
                1
              );


            game.multiplier =
              1 +
              Math.min(
                4.2,
                game.combo *
                0.075
              );

          }

        }

      }


      /*
        Okresowy flash.
      */

      if (
        game.survival >
          0 &&
        Math.floor(
          game.survival
        ) %
        15 ===
          0 &&
        game.flash <=
          0.01
      ) {

        game.flash =
          0.08;

      }

    }


    /* ==========================================================
       COLLECT DATA
    ========================================================== */

    function collectData(
      item
    ) {

      game.combo +=
        1;


      game.comboTimer =
        2.25;


      game.multiplier =
        1 +
        Math.min(
          4.2,
          game.combo *
          0.075
        );


      const points =
        Math.round(
          item.value *
          game.multiplier +
          game.speedScale *
          4
        );


      game.score +=
        points;


      burst(
        item.x,
        item.y,
        colors.green,

        LOW_FX
          ? Math.min(
              12,
              8 +
              game.combo
            )

          : Math.min(
              26,
              14 +
              game.combo
            ),

        190
      );


      shockwave(
        item.x,
        item.y,
        colors.green,
        48
      );


      spawnMessage(
        `+${points}`,
        item.x,
        item.y - 8,
        colors.green
      );


      sfx.collect(
        game.multiplier
      );


      updateHUD();

    }


    /* ==========================================================
       SHIELD
    ========================================================== */

    function collectShield(
      item
    ) {

      game.player.shield =
        clamp(
          game.player.shield +
          1,

          0,
          2
        );


      game.score +=
        35;


      game.comboTimer =
        2;


      burst(
        item.x,
        item.y,
        colors.cyan,

        LOW_FX
          ? 14
          : 30,

        210
      );


      shockwave(
        item.x,
        item.y,
        colors.cyan,
        60
      );


      spawnMessage(
        "SHIELD",
        item.x,
        item.y - 10,
        colors.cyan
      );


      sfx.shield();


      updateHUD();

    }


    /* ==========================================================
       VIRUS COLLISION
    ========================================================== */

    function collideVirus(
      item
    ) {

      burst(
        item.x,
        item.y,
        colors.red,

        LOW_FX
          ? 22
          : 48,

        285
      );


      shockwave(
        item.x,
        item.y,
        colors.red,
        92
      );


      addShake(
        13,
        0.34
      );


      game.flash =
        0.28;


      sfx.explosion();


      if (
        game.player.invincible >
        0 ||
        game.player.shield >
        0
      ) {

        if (
          game.player.shield >
            0 &&
          game.player.invincible <=
            0
        ) {

          game.player.shield -=
            1;

        }


        game.score +=
          8;


        spawnMessage(
          "BLOCK",
          item.x,
          item.y - 10,
          colors.yellow
        );


        updateHUD();


        return;

      }


      endRun();

    }


    /* ==========================================================
       END RUN
    ========================================================== */

    function endRun() {

      stopGameLoop();


      game.state =
        "gameover";


      game.comboTimer =
        0;


      game.multiplier =
        1;


      game.best =
        Math.max(
          game.best,
          Math.floor(
            game.score
          )
        );


      void saveGame();

      void sendScoreIfBest();


      addShake(
        18,
        0.42
      );


      sfx.gameOver();


      updateHUD(true);


      showGameOverMenu();

    }


    /* ==========================================================
       EFFECT UPDATE
    ========================================================== */

    function updateEffects(
      dt
    ) {

      /*
        Stars.
      */

      for (
        const star of
        game.stars
      ) {

        const speedBoost =
          game.state ===
          "playing"

            ? game.speedScale

            : 0.5;


        star.y +=
          star.speed *
          speedBoost *
          dt;


        if (
          star.y >
          LOGICAL_HEIGHT +
          4
        ) {

          star.y =
            -4;


          star.x =
            rand(
              0,
              LOGICAL_WIDTH
            );

        }

      }


      /*
        Particles.
      */

      for (
        let i =
          game.particles.length -
          1;

        i >= 0;

        i--
      ) {

        const p =
          game.particles[i];


        p.life -=
          dt;


        if (
          p.life <=
          0
        ) {

          game.particles.splice(
            i,
            1
          );


          continue;

        }


        const drag =
          Math.pow(
            p.drag,
            dt *
            60
          );


        p.vx *=
          drag;


        p.vy *=
          drag;


        p.vy +=
          120 *
          dt;


        p.x +=
          p.vx *
          dt;


        p.y +=
          p.vy *
          dt;

      }


      /*
        Shockwaves.
      */

      for (
        let i =
          game.shockwaves.length -
          1;

        i >= 0;

        i--
      ) {

        const wave =
          game.shockwaves[i];


        wave.age +=
          dt;


        if (
          wave.age >=
          wave.life
        ) {

          game.shockwaves.splice(
            i,
            1
          );

        }

      }


      /*
        Messages.
      */

      for (
        let i =
          game.messages.length -
          1;

        i >= 0;

        i--
      ) {

        const msg =
          game.messages[i];


        msg.life -=
          dt;


        if (
          msg.life <=
          0
        ) {

          game.messages.splice(
            i,
            1
          );


          continue;

        }


        msg.y +=
          msg.vy *
          dt;

      }


      /*
        Camera shake.
      */

      if (
        game.shakeTime >
        0
      ) {

        game.shakeTime -=
          dt;


        game.shake *=
          Math.pow(
            0.84,
            dt *
            60
          );

      }

      else {

        game.shake =
          0;

      }


      game.flash =
        Math.max(
          0,
          game.flash -
          dt *
          1.9
        );

    }


    /* ==========================================================
       STARS
    ========================================================== */

    function buildStars() {

      game.stars.length =
        0;


      for (
        let i = 0;

        i < STAR_COUNT;

        i += 1
      ) {

        game.stars.push({

          x:
            rand(
              0,
              LOGICAL_WIDTH
            ),

          y:
            rand(
              0,
              LOGICAL_HEIGHT
            ),

          speed:
            rand(
              12,
              56
            ),

          size:
            rand(
              0.6,
              1.8
            ),

          hue:
            Math.random() <
            0.5

              ? colors.cyan

              : colors.pink

        });

      }

    }


    /* ==========================================================
       STAR SPRITES
    ========================================================== */

    const STAR_SPRITE_SIZE =
      24;


    let starSpriteCyan =
      null;

    let starSpritePink =
      null;


    function makeGlowSprite(
      hexColor
    ) {

      const spriteCanvas =
        document.createElement(
          "canvas"
        );


      spriteCanvas.width =
        STAR_SPRITE_SIZE;


      spriteCanvas.height =
        STAR_SPRITE_SIZE;


      const sctx =
        spriteCanvas.getContext(
          "2d"
        );


      const c =
        STAR_SPRITE_SIZE /
        2;


      const gradient =
        sctx.createRadialGradient(
          c,
          c,
          0,
          c,
          c,
          c
        );


      gradient.addColorStop(
        0,
        hexColor
      );


      gradient.addColorStop(
        0.35,
        hexColor
      );


      gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
      );


      sctx.fillStyle =
        gradient;


      sctx.fillRect(
        0,
        0,
        STAR_SPRITE_SIZE,
        STAR_SPRITE_SIZE
      );


      return spriteCanvas;

    }


    function buildStarSprites() {

      starSpriteCyan =
        makeGlowSprite(
          colors.cyan
        );


      starSpritePink =
        makeGlowSprite(
          colors.pink
        );

    }


    /* ==========================================================
       SCANLINE CACHE
    ========================================================== */

    let scanlinePattern =
      null;


    function buildScanlinePattern() {

      const tile =
        document.createElement(
          "canvas"
        );


      tile.width =
        1;


      tile.height =
        4;


      const tctx =
        tile.getContext(
          "2d"
        );


      tctx.fillStyle =
        "#ffffff";


      tctx.fillRect(
        0,
        0,
        1,
        1
      );


      scanlinePattern =
        ctx.createPattern(
          tile,
          "repeat"
        );

    }


    /* ==========================================================
       BACKGROUND GRADIENT CACHE
    ========================================================== */

    let backgroundGradient =
      null;


    let telemetryGradient =
      null;


    function buildGradients() {

      backgroundGradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          LOGICAL_HEIGHT
        );


      backgroundGradient
        .addColorStop(
          0,
          "#060712"
        );


      backgroundGradient
        .addColorStop(
          0.52,
          "#090b1f"
        );


      backgroundGradient
        .addColorStop(
          1,
          "#04050d"
        );


      telemetryGradient =
        ctx.createLinearGradient(
          34,
          0,
          LOGICAL_WIDTH -
          34,
          0
        );


      telemetryGradient
        .addColorStop(
          0,
          colors.cyan
        );


      telemetryGradient
        .addColorStop(
          0.48,
          colors.green
        );


      telemetryGradient
        .addColorStop(
          1,
          colors.pink
        );

    }


    /* ==========================================================
       CANVAS TRANSFORM
    ========================================================== */

    function setTransformWithShake() {

      const scaleX =
        canvas.width /
        LOGICAL_WIDTH;


      const scaleY =
        canvas.height /
        LOGICAL_HEIGHT;


      const shakePower =
        game.shakeTime >
        0

          ? game.shake

          : 0;


      let sx =
        0;

      let sy =
        0;


      if (
        shakePower
      ) {

        sx =
          rand(
            -shakePower,
            shakePower
          );


        sy =
          rand(
            -shakePower,
            shakePower
          );

      }


      ctx.setTransform(
        scaleX,
        0,
        0,
        scaleY,

        sx *
        scaleX,

        sy *
        scaleY
      );

    }


    function resetCanvasTransform() {

      ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
      );

    }


    /* ==========================================================
       DRAW BACKGROUND
    ========================================================== */

    function drawBackground(
      time
    ) {

      ctx.fillStyle =
        backgroundGradient;


      ctx.fillRect(
        0,
        0,
        LOGICAL_WIDTH,
        LOGICAL_HEIGHT
      );


      /*
        Stars:
        pre-rendered sprite zamiast
        shadowBlur na każdej gwieździe.
      */

      ctx.save();

      ctx.globalCompositeOperation =
        "lighter";


      for (
        const star of
        game.stars
      ) {

        const sprite =
          star.hue ===
          colors.cyan

            ? starSpriteCyan

            : starSpritePink;


        if (
          !sprite
        ) {

          continue;

        }


        const size =
          STAR_SPRITE_SIZE *
          (
            0.32 +
            star.size *
            0.34
          );


        ctx.globalAlpha =
          0.32 +
          star.size *
          0.20;


        ctx.drawImage(
          sprite,

          star.x -
          size / 2,

          star.y -
          size / 2,

          size,
          size
        );

      }


      ctx.restore();


      drawGrid(
        time
      );


      drawRails(
        time
      );

    }


    /* ==========================================================
       GRID
    ========================================================== */

    function drawGrid(
      time
    ) {

      const horizon =
        185;


      const spacing =
        37;


      const offset =
        (
          time *
          70 *
          (
            game.state ===
            "playing"

              ? game.speedScale

              : 0.6
          )
        ) %
        spacing;


      ctx.save();


      ctx.lineWidth =
        1;


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          8;

        ctx.shadowColor =
          colors.cyan;

      }


      for (
        let y =
          horizon +
          offset;

        y <
          LOGICAL_HEIGHT +
          spacing;

        y +=
          spacing
      ) {

        const t =
          (
            y -
            horizon
          ) /
          (
            LOGICAL_HEIGHT -
            horizon
          );


        ctx.globalAlpha =
          clamp(
            t *
            0.42,

            0.06,
            0.42
          );


        ctx.strokeStyle =
          colors.cyan;


        ctx.beginPath();


        ctx.moveTo(
          0,
          y
        );


        ctx.lineTo(
          LOGICAL_WIDTH,
          y
        );


        ctx.stroke();

      }


      for (
        let i = -5;

        i <= 5;

        i += 1
      ) {

        const xBottom =
          LOGICAL_WIDTH / 2 +
          i *
          70;


        ctx.globalAlpha =
          0.18;


        ctx.strokeStyle =
          i % 2 ===
          0

            ? colors.pink

            : colors.cyan;


        ctx.beginPath();


        ctx.moveTo(
          LOGICAL_WIDTH / 2 +
          i *
          9,

          horizon
        );


        ctx.lineTo(
          xBottom,
          LOGICAL_HEIGHT
        );


        ctx.stroke();

      }


      ctx.restore();

    }


    /* ==========================================================
       RAILS
    ========================================================== */

    function drawRails(
      time
    ) {

      ctx.save();


      ctx.globalCompositeOperation =
        "lighter";


      ctx.lineWidth =
        2;


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          12;

      }


      const pulse =
        Math.sin(
          time *
          5.2
        ) *
        0.5 +
        0.5;


      ctx.globalAlpha =
        0.22 +
        pulse *
        0.18;


      ctx.strokeStyle =
        colors.pink;


      if (
        !LOW_FX
      ) {

        ctx.shadowColor =
          colors.pink;

      }


      ctx.beginPath();


      ctx.moveTo(
        26,
        0
      );


      ctx.bezierCurveTo(
        42,
        190,
        18,
        420,
        54,
        LOGICAL_HEIGHT
      );


      ctx.stroke();


      ctx.strokeStyle =
        colors.cyan;


      if (
        !LOW_FX
      ) {

        ctx.shadowColor =
          colors.cyan;

      }


      ctx.beginPath();


      ctx.moveTo(
        LOGICAL_WIDTH -
        26,
        0
      );


      ctx.bezierCurveTo(
        LOGICAL_WIDTH -
        42,
        190,

        LOGICAL_WIDTH -
        18,
        420,

        LOGICAL_WIDTH -
        54,
        LOGICAL_HEIGHT
      );


      ctx.stroke();


      ctx.restore();

    }


    /* ==========================================================
       DRAW ITEMS
    ========================================================== */

    function drawItems(
      time
    ) {

      for (
        const item of
        game.items
      ) {

        if (
          item.type ===
          "data"
        ) {

          drawData(
            item,
            time
          );

        }

        else if (
          item.type ===
          "shield"
        ) {

          drawShieldPickup(
            item,
            time
          );

        }

        else {

          drawVirus(
            item,
            time
          );

        }

      }

    }


    /* ==========================================================
       DATA
    ========================================================== */

    function drawData(
      item,
      time
    ) {

      const pulse =
        Math.sin(
          time *
          8 +
          item.phase
        ) *
        0.5 +
        0.5;


      ctx.save();


      ctx.translate(
        item.x,
        item.y
      );


      ctx.rotate(
        item.rot
      );


      ctx.globalCompositeOperation =
        "lighter";


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          14 +
          pulse *
          6;


        ctx.shadowColor =
          colors.green;

      }


      ctx.strokeStyle =
        colors.green;


      ctx.fillStyle =
        "rgba(109,255,115,0.28)";


      ctx.lineWidth =
        2;


      ctx.beginPath();


      ctx.moveTo(
        0,
        -item.radius *
        1.35
      );


      ctx.lineTo(
        item.radius *
        1.15,
        0
      );


      ctx.lineTo(
        0,
        item.radius *
        1.35
      );


      ctx.lineTo(
        -item.radius *
        1.15,
        0
      );


      ctx.closePath();


      ctx.fill();

      ctx.stroke();


      ctx.restore();

    }


    /* ==========================================================
       SHIELD
    ========================================================== */

    function drawShieldPickup(
      item,
      time
    ) {

      const pulse =
        Math.sin(
          time *
          7 +
          item.phase
        ) *
        0.5 +
        0.5;


      ctx.save();


      ctx.translate(
        item.x,
        item.y
      );


      ctx.rotate(
        item.rot *
        0.8
      );


      ctx.globalCompositeOperation =
        "lighter";


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          16 +
          pulse *
          6;


        ctx.shadowColor =
          colors.cyan;

      }


      ctx.strokeStyle =
        colors.cyan;


      ctx.fillStyle =
        "rgba(18,247,255,0.16)";


      ctx.lineWidth =
        2;


      ctx.beginPath();


      for (
        let i = 0;

        i < 6;

        i += 1
      ) {

        const a =
          -Math.PI / 2 +
          i *
          TAU /
          6;


        const x =
          Math.cos(a) *
          item.radius *
          1.45;


        const y =
          Math.sin(a) *
          item.radius *
          1.45;


        if (
          i ===
          0
        ) {

          ctx.moveTo(
            x,
            y
          );

        }

        else {

          ctx.lineTo(
            x,
            y
          );

        }

      }


      ctx.closePath();


      ctx.fill();

      ctx.stroke();


      ctx.globalAlpha =
        0.90;


      ctx.beginPath();


      ctx.arc(
        0,
        0,
        item.radius *
        0.55,
        0,
        TAU
      );


      ctx.fillStyle =
        colors.cyan;


      ctx.fill();


      ctx.restore();

    }


    /* ==========================================================
       VIRUS
    ========================================================== */

    function drawVirus(
      item,
      time
    ) {

      const spikes =
        9;


      const pulse =
        Math.sin(
          time *
          9 +
          item.phase
        ) *
        0.5 +
        0.5;


      ctx.save();


      ctx.translate(
        item.x,
        item.y
      );


      ctx.rotate(
        item.rot
      );


      ctx.globalCompositeOperation =
        "lighter";


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          16 +
          pulse *
          8;


        ctx.shadowColor =
          colors.red;

      }


      ctx.strokeStyle =
        colors.red;


      ctx.fillStyle =
        "rgba(255,49,93,0.30)";


      ctx.lineWidth =
        2;


      ctx.beginPath();


      for (
        let i = 0;

        i <
        spikes *
        2;

        i += 1
      ) {

        const radius =
          i % 2 ===
          0

            ? item.radius *
              1.45

            : item.radius *
              0.72;


        const a =
          i *
          Math.PI /
          spikes;


        const x =
          Math.cos(a) *
          radius;


        const y =
          Math.sin(a) *
          radius;


        if (
          i ===
          0
        ) {

          ctx.moveTo(
            x,
            y
          );

        }

        else {

          ctx.lineTo(
            x,
            y
          );

        }

      }


      ctx.closePath();


      ctx.fill();

      ctx.stroke();


      ctx.globalAlpha =
        0.90;


      ctx.beginPath();


      ctx.arc(
        0,
        0,
        item.radius *
        0.38,
        0,
        TAU
      );


      ctx.fillStyle =
        colors.pink;


      ctx.fill();


      ctx.restore();

    }


    /* ==========================================================
       PLAYER
    ========================================================== */

    function drawPlayer(
      time
    ) {

      const player =
        game.player;


      const invPulse =
        player.invincible >
        0

          ? Math.sin(
              time *
              22
            ) *
            0.5 +
            0.5

          : 1;


      ctx.save();


      ctx.translate(
        player.x,
        PLAYER_Y
      );


      ctx.rotate(
        player.lean *
        0.018
      );


      ctx.globalAlpha =
        player.invincible >
        0

          ? 0.62 +
            invPulse *
            0.38

          : 1;


      ctx.globalCompositeOperation =
        "lighter";


      if (
        player.shield >
          0 ||
        player.invincible >
          0
      ) {

        const radius =
          player.radius +
          10 +
          Math.sin(
            time *
            6
          ) *
          2;


        ctx.lineWidth =
          player.shield >
          1

            ? 4

            : 3;


        ctx.strokeStyle =
          player.shield >
          0

            ? colors.yellow

            : colors.cyan;


        if (
          !LOW_FX
        ) {

          ctx.shadowBlur =
            22;


          ctx.shadowColor =
            ctx.strokeStyle;

        }


        ctx.globalAlpha =
          player.invincible >
          0

            ? 0.70 +
              invPulse *
              0.25

            : 0.72;


        ctx.beginPath();


        ctx.arc(
          0,
          0,
          radius,
          0,
          TAU
        );


        ctx.stroke();


        ctx.globalAlpha =
          player.invincible >
          0

            ? 0.55 +
              invPulse *
              0.20

            : 1;

      }


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          20;

        ctx.shadowColor =
          colors.cyan;

      }


      ctx.fillStyle =
        "rgba(18,247,255,0.22)";


      ctx.strokeStyle =
        colors.cyan;


      ctx.lineWidth =
        4;


      ctx.beginPath();


      ctx.moveTo(
        0,
        -player.radius -
        12
      );


      ctx.bezierCurveTo(
        player.radius +
        17,

        -player.radius +
        14,

        player.radius +
        19,

        player.radius +
        6,

        0,

        player.radius +
        14
      );


      ctx.bezierCurveTo(
        -player.radius -
        19,

        player.radius +
        6,

        -player.radius -
        17,

        -player.radius +
        14,

        0,

        -player.radius -
        12
      );


      ctx.closePath();


      ctx.fill();

      ctx.stroke();


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          14;

        ctx.shadowColor =
          colors.pink;

      }


      ctx.strokeStyle =
        colors.pink;


      ctx.lineWidth =
        2;


      ctx.beginPath();


      ctx.arc(
        0,
        2,
        player.radius *
        0.82,

        Math.PI *
        0.08,

        Math.PI *
        0.92,

        true
      );


      ctx.stroke();


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          8;

        ctx.shadowColor =
          colors.cyan;

      }


      ctx.fillStyle =
        colors.ink;


      ctx.beginPath();


      ctx.arc(
        -7,
        -2,
        3,
        0,
        TAU
      );


      ctx.arc(
        7,
        -2,
        3,
        0,
        TAU
      );


      ctx.fill();


      ctx.restore();

    }


    /* ==========================================================
       PARTICLES
    ========================================================== */

    function drawParticles() {

      if (
        game.particles.length ===
        0
      ) {

        return;

      }


      ctx.save();


      ctx.globalCompositeOperation =
        "lighter";


      /*
        Bez shadowBlur
        i bez save/restore
        dla każdego particle.
      */

      for (
        const p of
        game.particles
      ) {

        ctx.globalAlpha =
          clamp(
            p.life /
            p.maxLife,
            0,
            1
          );


        ctx.fillStyle =
          p.color;


        ctx.fillRect(

          p.x -
          p.size *
          0.5,

          p.y -
          p.size *
          0.5,

          p.size,

          p.size

        );

      }


      ctx.restore();

    }


    /* ==========================================================
       SHOCKWAVES
    ========================================================== */

    function drawShockwaves() {

      if (
        game.shockwaves.length ===
        0
      ) {

        return;

      }


      ctx.save();


      ctx.globalCompositeOperation =
        "lighter";


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          18;

      }


      for (
        const w of
        game.shockwaves
      ) {

        const t =
          clamp(
            w.age /
            w.life,
            0,
            1
          );


        ctx.globalAlpha =
          (
            1 -
            t
          ) *
          0.72;


        ctx.lineWidth =
          2 +
          t *
          5;


        ctx.strokeStyle =
          w.color;


        if (
          !LOW_FX
        ) {

          ctx.shadowColor =
            w.color;

        }


        ctx.beginPath();


        ctx.arc(
          w.x,
          w.y,

          w.radius *
          easeOutCubic(
            t
          ),

          0,
          TAU
        );


        ctx.stroke();

      }


      ctx.restore();

    }


    /* ==========================================================
       MESSAGES
    ========================================================== */

    function drawMessages() {

      if (
        game.messages.length ===
        0
      ) {

        return;

      }


      ctx.save();


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";


      ctx.font =
        "900 20px Trebuchet MS, sans-serif";


      ctx.globalCompositeOperation =
        "lighter";


      for (
        const msg of
        game.messages
      ) {

        const t =
          clamp(
            msg.life /
            msg.maxLife,
            0,
            1
          );


        ctx.globalAlpha =
          t;


        ctx.fillStyle =
          msg.color;


        if (
          !LOW_FX
        ) {

          ctx.shadowBlur =
            10;

          ctx.shadowColor =
            msg.color;

        }


        ctx.fillText(
          msg.text,
          msg.x,
          msg.y
        );

      }


      ctx.restore();

    }


    /* ==========================================================
       TELEMETRY
    ========================================================== */

    function drawRunTelemetry() {

      ctx.save();


      const progress =
        clamp(
          game.survival /
          60,
          0,
          1
        );


      const y =
        LOGICAL_HEIGHT -
        24;


      ctx.globalAlpha =
        0.85;


      ctx.fillStyle =
        "rgba(255,255,255,0.10)";


      ctx.fillRect(
        34,
        y,
        LOGICAL_WIDTH -
        68,
        5
      );


      ctx.fillStyle =
        telemetryGradient;


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          10;

        ctx.shadowColor =
          colors.cyan;

      }


      ctx.fillRect(
        34,
        y,

        (
          LOGICAL_WIDTH -
          68
        ) *
        progress,

        5
      );


      if (
        game.state ===
        "playing"
      ) {

        ctx.globalAlpha =
          0.72;


        ctx.fillStyle =
          colors.yellow;


        ctx.font =
          "900 12px Trebuchet MS, sans-serif";


        ctx.textAlign =
          "center";


        ctx.fillText(
          `${Math.floor(
            game.survival
          )}s`,

          LOGICAL_WIDTH /
          2,

          y -
          8
        );

      }


      ctx.restore();

    }


    /* ==========================================================
       SCANLINES
    ========================================================== */

    function drawScanlines() {

      /*
        Na mobile całkowicie wyłączone.
      */

      if (
        LOW_FX ||
        !scanlinePattern
      ) {

        return;

      }


      ctx.save();


      ctx.globalAlpha =
        0.045;


      ctx.fillStyle =
        scanlinePattern;


      ctx.fillRect(
        0,
        0,
        LOGICAL_WIDTH,
        LOGICAL_HEIGHT
      );


      ctx.restore();

    }


    /* ==========================================================
       FLASH
    ========================================================== */

    function drawFlash() {

      if (
        game.flash <=
        0
      ) {

        return;

      }


      ctx.save();


      ctx.globalAlpha =
        clamp(
          game.flash,
          0,
          0.30
        );


      /*
        Na słabszych telefonach
        prosty fill zamiast
        radial gradientu.
      */

      if (
        LOW_FX
      ) {

        ctx.fillStyle =
          "rgba(255,49,93,0.55)";


        ctx.fillRect(
          0,
          0,
          LOGICAL_WIDTH,
          LOGICAL_HEIGHT
        );

      }

      else {

        const gradient =
          ctx.createRadialGradient(
            LOGICAL_WIDTH / 2,
            PLAYER_Y,
            20,

            LOGICAL_WIDTH / 2,
            PLAYER_Y,
            LOGICAL_HEIGHT *
            0.8
          );


        gradient.addColorStop(
          0,
          "rgba(255,255,255,0.86)"
        );


        gradient.addColorStop(
          0.22,
          "rgba(255,49,93,0.45)"
        );


        gradient.addColorStop(
          1,
          "rgba(255,49,93,0)"
        );


        ctx.fillStyle =
          gradient;


        ctx.fillRect(
          0,
          0,
          LOGICAL_WIDTH,
          LOGICAL_HEIGHT
        );

      }


      ctx.restore();

    }


    /* ==========================================================
       ATTRACT MODE
    ========================================================== */

    function drawAttractMode(
      time
    ) {

      ctx.save();


      ctx.globalCompositeOperation =
        "lighter";


      ctx.globalAlpha =
        0.55;


      const cx =
        LOGICAL_WIDTH /
        2;


      const cy =
        PLAYER_Y -
        74 +
        Math.sin(
          time *
          2
        ) *
        4;


      ctx.strokeStyle =
        colors.violet;


      if (
        !LOW_FX
      ) {

        ctx.shadowBlur =
          18;

        ctx.shadowColor =
          colors.violet;

      }


      ctx.lineWidth =
        2;


      for (
        let i = 0;

        i < 4;

        i += 1
      ) {

        ctx.beginPath();


        ctx.arc(
          cx,
          cy,

          38 +
          i *
          20 +
          Math.sin(
            time *
            1.8 +
            i
          ) *
          3,

          0,
          TAU
        );


        ctx.stroke();

      }


      ctx.restore();

    }


    /* ==========================================================
       RENDER
    ========================================================== */

    function draw(
      time
    ) {

      /*
        Resize wykonuje realne
        operacje tylko wtedy,
        gdy host faktycznie
        zmieni rozmiar.
      */

      resizeCanvas();


      setTransformWithShake();


      drawBackground(
        time
      );


      if (
        game.state ===
          "menu" ||
        game.state ===
          "boot"
      ) {

        drawAttractMode(
          time
        );

      }


      drawItems(
        time
      );


      drawParticles();


      drawShockwaves();


      drawPlayer(
        time
      );


      drawMessages();


      drawRunTelemetry();


      drawScanlines();


      drawFlash();


      resetCanvasTransform();

    }


    /* ==========================================================
       GAME LOOP
    ========================================================== */

    let lastFrame =
      performance.now();


    let rafId =
      0;


    let loopRunning =
      false;


    function startGameLoop() {

      if (
        loopRunning
      ) {

        return;

      }


      loopRunning =
        true;


      lastFrame =
        performance.now();


      rafId =
        requestAnimationFrame(
          frame
        );

    }


    function stopGameLoop() {

      if (
        !loopRunning
      ) {

        return;

      }


      loopRunning =
        false;


      if (
        rafId
      ) {

        cancelAnimationFrame(
          rafId
        );


        rafId =
          0;

      }

    }


    function frame(
      now
    ) {

      if (
        !loopRunning
      ) {

        return;

      }


      const dt =
        clamp(
          (
            now -
            lastFrame
          ) /
          1000,

          0,
          0.033
        );


      lastFrame =
        now;


      const time =
        now /
        1000;


      if (
        game.state ===
        "playing" &&
        !game.adActive
      ) {

        updatePlaying(
          dt
        );


        updateEffects(
          dt
        );

      }


      draw(
        time
      );


      if (
        !game.firstFrameSent
      ) {

        notifyFirstFrameReady();

      }


      rafId =
        requestAnimationFrame(
          frame
        );

    }


    /* ==========================================================
       POINTER
    ========================================================== */

    function clientToGameX(
      clientX
    ) {

      const rect =
        game.canvasRect ||
        canvas.getBoundingClientRect();


      return clamp(

        (
          clientX -
          rect.left
        ) /
        rect.width *
        LOGICAL_WIDTH,

        30,

        LOGICAL_WIDTH -
        30

      );

    }


    function handlePointer(
      event
    ) {

      if (
        game.state !==
        "playing"
      ) {

        return;

      }


      event.preventDefault();


      game.input.pointerActive =
        true;


      game.player.targetX =
        clientToGameX(
          event.clientX
        );

    }


    canvas.addEventListener(
      "pointerdown",

      event => {

        void
          unlockAudioFromGesture();


        handlePointer(
          event
        );


        try {

          canvas.setPointerCapture(
            event.pointerId
          );

        } catch (_) {}

      },

      {
        passive: false
      }
    );


    canvas.addEventListener(
      "pointermove",
      handlePointer,
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "pointerup",
      () => {

        game.input.pointerActive =
          false;

      },
      {
        passive: true
      }
    );


    canvas.addEventListener(
      "pointercancel",
      () => {

        game.input.pointerActive =
          false;

      },
      {
        passive: true
      }
    );


    /* ==========================================================
       KEYBOARD
    ========================================================== */

    window.addEventListener(
      "keydown",
      event => {

        const key =
          event.key.toLowerCase();


        if (
          key ===
            "arrowleft" ||
          key ===
            "a"
        ) {

          game.input.left =
            true;


          event.preventDefault();

        }


        if (
          key ===
            "arrowright" ||
          key ===
            "d"
        ) {

          game.input.right =
            true;


          event.preventDefault();

        }


        if (
          key ===
            " " ||
          key ===
            "enter"
        ) {

          if (
            game.state ===
            "menu"
          ) {

            startRun();

          }

          else if (
            game.state ===
              "playing" ||
            game.state ===
              "paused"
          ) {

            togglePause();

          }


          event.preventDefault();

        }


        if (
          key ===
          "m"
        ) {

          toggleSound();

        }

      }
    );


    window.addEventListener(
      "keyup",
      event => {

        const key =
          event.key.toLowerCase();


        if (
          key ===
            "arrowleft" ||
          key ===
            "a"
        ) {

          game.input.left =
            false;

        }


        if (
          key ===
            "arrowright" ||
          key ===
            "d"
        ) {

          game.input.right =
            false;

        }

      }
    );


    /* ==========================================================
       SOUND TOGGLE
    ========================================================== */

    function toggleSound() {

      audio.enabled =
        !audio.enabled;


      updateAudioGains();


      updateSoundButton();


      if (
        audio.enabled
      ) {

        void
          unlockAudioFromGesture();


        void
          resumeAudio();


        sfx.click();

      }

      else {

        stopMusic();

      }

    }


    soundBtn.addEventListener(
      "click",
      toggleSound
    );


    pauseBtn.addEventListener(
      "click",
      togglePause
    );


    /* ==========================================================
       RESIZE OBSERVER
    ========================================================== */

    if (
      typeof ResizeObserver !==
      "undefined"
    ) {

      const observer =
        new ResizeObserver(
          () => {

            game.resizeDirty =
              true;

          }
        );


      observer.observe(
        canvas
      );

    }

    else {

      window.addEventListener(
        "resize",

        () => {

          game.resizeDirty =
            true;

        },

        {
          passive: true
        }
      );

    }


    window.addEventListener(
      "orientationchange",

      () => {

        game.resizeDirty =
          true;

      },

      {
        passive: true
      }
    );


    /* ==========================================================
       ERROR HANDLERS
    ========================================================== */

    window.addEventListener(
      "error",

      event => {

        reportError(
          event.error ||
          event.message
        );

      }
    );


    window.addEventListener(
      "unhandledrejection",

      event => {

        reportError(
          event.reason
        );

      }
    );


    /* ==========================================================
       BOOT
    ========================================================== */

    async function boot() {

      buildStars();


      buildStarSprites();


      buildScanlinePattern();


      buildGradients();


      game.resizeDirty =
        true;


      resizeCanvas();


      initSDKHooks();


      await loadSave();


      updateSoundButton();


      updateHUD(
        true
      );


      showMenu();


      /*
        Najpierw render
        rzeczywiście gotowego
        pierwszego ekranu.
      */

      draw(
        performance.now() /
        1000
      );


      /*
        Playables lifecycle:
        first frame -> game ready.
      */

      notifyFirstFrameReady();

      notifyGameReady();


      /*
        Włączamy główną pętlę
        po przygotowaniu gry.
      */

      startGameLoop();

    }


    boot().catch(
      error => {

        reportError(
          error
        );


        showMenu();


        startGameLoop();

      }
    );

  })();
  </script>

</body>
